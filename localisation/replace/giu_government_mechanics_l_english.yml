 # Freedom
 enthrallment_aid_against_amascut:0 "Aid Against Amascut"
 enthrallment_aid_against_amascut_desc:0 "Some remain who can resist Amascut's corruption. If they could just get the word out to our allies, they might be able to fight these binds."
 enthrallment_feather_of_maat:0 "Feather of Ma'at"
 enthrallment_feather_of_maat_desc:0 "The few left who resist the Devourer might be able to secure a Feather of Ma'at, which has the power to repel corruption."
 enthrallment_blood_moon_order:0 "Promote the Order of the Blood Moon"
 enthrallment_blood_moon_order_desc:0 "Once serving Elidinis, the Order of the Blood Moon was taken over by Amascut to serve her interests. Although promoting the Order could be a great source of manpower so long as we side with Amascut, it could also reawaken dormant allegiances to Elidinis."
 amascut_religion_promote_blood_moon_tooltip:0 "While this modifier is active, assigning a §YLocal Organisation§! such as Order of the Blood Moon will reduce your §YEnthrallment§! by 10."
 
 #Captivity
 enthrallment_proselytise_amascut:0 "Proselytise Amascut"
 enthrallment_proselytise_amascut_desc:0 "Usually Amascut does not engage in conventional proselytisation, preferring instead to bribe or force people to do her bidding. Still, if our peoples' minds were just clear enough to sound convincingly non-monstrous, it could be a boon to conversion efforts."
 enthrallment_internalise_the_corruption:0 "Internalise the Corruption"
 enthrallment_internalise_the_corruption_desc:0 "If we take corruption within ourselves, we can serve the Devourer in a more orderly fashion."
 enthrallment_slayers_boon:0 "Slayer's Boon"
 enthrallment_slayers_boon_desc:0 "Amascut founded the Order of Slayer Masters and can grant us her knowledge of monster-killing."

 

