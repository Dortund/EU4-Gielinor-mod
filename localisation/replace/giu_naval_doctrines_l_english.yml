l_english:
 fremennik_longship_doctrine:0 "Longship Expansion"
 fremennik_longship_doctrine_desc:0 "Longships are cheap and versatile. If we emphasise their construction above other kinds of ships we can maximise their advantages."
 
 moonclan_ship_curses_doctrine:0 "Ship Curses"
 moonclan_ship_curses_doctrine_desc:0 "Despite the incredible seafaring capabilities of the mainland Fremennik, the Moonclan have been able to resist their attacks through the use of magical curses."
 
 crandorian_design_doctrine:0 "Crandorian Design"
 crandorian_design_doctrine_desc:0 "Crandor's shipbuilding capabilities are legendary - and necessary to handle the harsh reefs that surround the island."

 tortugan_explorers_doctrine:0 "Tortugan Explorers"
 tortugan_explorers_doctrine_desc:0 "Traditionally, Tortugans who come of age leave the Great Conch to explore the seas of Gielinor. When they grow older, they return, bringing the knowledge they accumulated with them."
 
 vampyric_abandon_the_sea_doctrine:0 "Abandon the Sea"
 vampyric_abandon_the_sea_doctrine_desc:0 "Vampyres do not fare well with running water, whether rivers or the sea. Perhaps it would be prudent to build on our strengths and maximise the strength of our land forces?"
 
 piscarilius_black_market_doctrine:0 "Piscarilian Black Market"
 piscarilius_black_market_doctrine_desc:0 "Port Piscarilius has developed great expertise in criminal activity which successive rulers of Kourend appear to turn a blind eye to - perhaps because this helps fund a larger fleet."
 
 spirit_angler_doctrine:0 "Spirit Anglers"
 spirit_angler_doctrine_desc:0 "A diverse array of skilled sailors have banded together to best the living sea storm known as the Tempoross."
 
 defer_to_the_admirals_doctrine:0 "Defer to the Admirals"
 defer_to_the_admirals_doctrine_desc:0 "The Admirality have considerable expertise in managing navies, so it may be prudent to leave decision-making to them."