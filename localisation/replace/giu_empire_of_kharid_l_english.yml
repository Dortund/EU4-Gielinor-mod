# Reforms
 kem_expand_settlements_reform_title:0 "Expand Settlements"
 kem_expand_settlements_reform_emperor:0 "Expand Settlements"
 kem_expand_settlements_reform_member:0 "Expand Settlements Kharidian Reform"
 kem_expand_settlements_reform_desc:0 "Tumeken's Mandate hardly rests upon the shoulders of a miniscule realm. We must promote the settlement of more of the Kharidian Desert if we are to accumulate his favour at a greater rate."
 enable_kharidian_settlement_expansion_decisions:0 "Enables decisions to create new Kharidian tributaries, which in turn help generate additional Mandate."
 
 kem_wushanko_trade_networks_reform_title:0 "Wushanko Trade Networks"
 kem_wushanko_trade_networks_reform_emperor:0 "Wushanko Trade Networks"
 kem_wushanko_trade_networks_reform_member:0 "Wushanko Trade Networks Kharidian Reform"
 kem_wushanko_trade_networks_reform_desc:0 "The Wushanko Isles are home to rich resources. The Kharidian cities can serve as an intermediary between the Wushankoan producers and the rest of the world, earning us enormous amounts of gold."
 
 kem_wushanko_tributary_reform_title:0 "Wushanko Tributaries"
 kem_wushanko_tributary_reform_emperor:0 "Wushanko Tributaries"
 kem_wushanko_tributary_reform_member:0 "Wushanko Tributaries Kharidian Reform"
 kem_wushanko_tributary_reform_desc:0 "In the interests of limiting piracy, we could take a more proactive role in securing our influence in the Arc and Skull regions."
 can_justify_overseas_tributary_vs_arc_skull_tooltip:0 "Enables use of the §YJustify Tributary Imposition§! diplomatic action against nations in the §YArc§! and §YSkull§! regions. "
 
 kem_karamjan_office_reform_title:0 "Karamjan Office"
 kem_karamjan_office_reform_emperor:0 "Karamjan Office"
 kem_karamjan_office_reform_member:0 "Karamjan Office Kharidian Reform"
 kem_karamjan_office_reform_desc:0 "Menaphites and Kharidians have common interests, notably including a similar religious tradition threatened by the expansion of Saradominists and Zamorakians. We also have a lot worth trading with each other. Let us establish an office to co-ordinate our various interests on the island!"
 
 kem_karamjan_tributary_reform_title:0 "Karamjan Tributaries"
 kem_karamjan_tributary_reform_emperor:0 "Karamjan Tributaries"
 kem_karamjan_tributary_reform_member:0 "Karamjan Tributaries Kharidian Reform"
 kem_karamjan_tributary_reform_desc:0 "Perhaps it is best to tie the fates of Karamja and Kharid together to resist the power of the northern kingdoms."
 can_justify_overseas_tributary_vs_karamja_tooltip:0 "Enables use of the §YJustify Tributary Imposition§! diplomatic action against nations in the §YKaramja§! region."
 can_propagate_versus_karamjan_tooltip:0 "If the §YPromote the Pantheon§! Reform is passed, may propagate religion in provinces of the §YKaramjan§! religion."
 
 kem_expand_tribute_web_reform_title:0 "Expand Tribute Web"
 kem_expand_tribute_web_reform_emperor:0 "Expand Tribute Web"
 kem_expand_tribute_web_reform_member:0 "Expand Tribute Web Kharidian Reform"
 kem_expand_tribute_web_reform_desc:0 "Kharidians have fought off the might of the Empty Lord, and of Zamorak, but both came at great expense. Through our tributaries it will be possible to fund our ambitions of restoring Kharid to its height."
 can_justify_overseas_tributary_vs_all_wushanko_tooltip:0 "Enables use of the §YJustify Tributary Imposition§! diplomatic action against nations in the §YWushanko Isles§! continent!"
 
 kem_promote_secularism_reform_title:0 "§OPromote Secularism§!"
 kem_promote_secularism_reform_emperor:0 "Promote Secularism"
 kem_promote_secularism_reform_member:0 "Promote Secularism Kharidian Reform"
 kem_promote_secularism_reform_desc:0 "The Menaphite Pantheon is very rarely followed outside of Kharid. Showing greater willingness to listen to outside perspectives may help us win allies further afield."
 
 kem_promote_the_pantheon_reform_title:0 "§OPromote the Pantheon§!"
 kem_promote_the_pantheon_reform_emperor:0 "Promote the Pantheon"
 kem_promote_the_pantheon_reform_member:0 "Promote the Pantheon Kharidian Reform"
 kem_promote_the_pantheon_reform_desc:0 "Our Pantheon has given so much for us, from repelling the Empty Lord to even protecting the dead. The rest of Gielinor should learn of their generousity."
 can_propagate_as_menaphite_tooltip:0 "Enables use of the §YPropagate Religion§! trading policy."
 
 kem_expand_spy_networks_reform_title:0 "Expand Spy Networks"
 kem_expand_spy_networks_reform_emperor:0 "Expand Spy Networks"
 kem_expand_spy_networks_reform_member:0 "Expand Spy Networks Kharidian Reform"
 kem_expand_spy_networks_reform_desc:0 "Our influence does not come without enemies, who seek to undermine us at every turn. Thankfully, extensive diplomatic networks with tributaries provide us for the potential for a great intelligence-gathering effort."
 
 kem_imperial_ambition_reform_title:0 "Imperial Ambition"
 kem_imperial_ambition_reform_emperor:0 "Imperial Ambition"
 kem_imperial_ambition_reform_member:0 "Imperial Ambition Kharidian Reform"
 kem_imperial_ambition_reform_desc:0 "The Empire of Kharid has been something of a misnomer given the scattered nature of Kharid's remaining cities. Yet we can let it be known we aim for something greater and form a true Empire!"
 
 kem_imperial_centralisation_reform_title:0 "Imperial Centralisation"
 kem_imperial_centralisation_reform_emperor:0 "Imperial Centralisation"
 kem_imperial_centralisation_reform_member:0 "Imperial Centralisation Kharidian Reform"
 kem_imperial_centralisation_reform_desc:0 "Tumeken's Mandate shores up our ascendant Empire. It is now time to centralise our rule under one Pharoah!"
 
 kem_reconstruction_of_uzer_reform_title:0 "Reconstruction of Uzer"
 kem_reconstruction_of_uzer_reform_emperor:0 "Reconstruction of Uzer"
 kem_reconstruction_of_uzer_reform_member:0 "Reconstruction of Uzer Kharidian Reform"
 kem_reconstruction_of_uzer_reform_desc:0 "Once among Gielinor's most powerful cities, Uzer was home to a diverse array of religious beliefs and magical crafters capable of building living clay golems. The God Wars left it in rubble. A strong enough Empire could rebuild it..."
 kem_restoration_of_uzer_empty_tooltip:0 "Resettles the city of §WUzer§! as our tributary!"
 kem_restoration_of_uzer_owned_tooltip:0 "Greatly develops our province of §WUzer§!!"
 kem_restoration_of_uzer_subject_tooltip:0 "Greatly develops our subject's province of §WUzer§!!"
 
 kem_reconstruction_of_ullek_reform_title:0 "Reconstruction of Ullek"
 kem_reconstruction_of_ullek_reform_emperor:0 "Reconstruction of Ullek"
 kem_reconstruction_of_ullek_reform_member:0 "Reconstruction of Ullek Kharidian Reform"
 kem_reconstruction_of_ullek_reform_desc:0 "Few cities had such immense wealth and power as Ullek - indeed, so much so it inspired Tumeken to create Crondis to remind its citizens of restraint. It was destroyed during the God Wars but its culture lives on among the people of Menaphos. Perhaps the time is right to restore it..."
 kem_restoration_of_ullek_empty_tooltip:0 "Resettles the city of §WUllek§! as our tributary!"
 kem_restoration_of_ullek_owned_tooltip:0 "Greatly develops our province of §WUllek§!!"
 kem_restoration_of_ullek_subject_tooltip:0 "Greatly develops our subject's province of §WUllek§!!"
 
 kem_desert_recovery_reform_title:0 "Desert Recovery"
 kem_desert_recovery_reform_emperor:0 "Desert Recovery"
 kem_desert_recovery_reform_member:0 "Desert Recovery Kharidian Reform"
 kem_desert_recovery_reform_desc:0 "If the threat of the Devourer were to be lifted - just for a moment - it would open an opportunity to recover lands lost since the God Wars."
 kem_desert_recovery_capital_is_prosperous:0 "Capital is experiencing prosperity"
 kem_desert_recovery_colonising_spree:0 "Every subject and tributary nation in the Kharidian region will gain a Frontier on a random adjacent uncolonised province!"
 
 kem_fleet_expansion_reform_title:0 "Fleet Expansion"
 kem_fleet_expansion_reform_emperor:0 "Fleet Expansion"
 kem_fleet_expansion_reform_member:0 "Fleet Expansion Kharidian Reform"
 kem_fleet_expansion_reform_desc:0 "We have heard of the growing naval prowess of the Asgarnians and it impresses upon us the need to keep an advantage over them."
 
 kem_colonial_expansion_reform_title:0 "Colonial Expansion"
 kem_colonial_expansion_reform_emperor:0 "Colonial Expansion"
 kem_colonial_expansion_reform_member:0 "Colonial Expansion Kharidian Reform"
 kem_colonial_expansion_reform_desc:0 "Citizens of tributary nations can suffer from a sense of crushed opportunity, so as their gracious overlord we can return it by offering them a chance of a lifetime in our colonies."
 
 kem_legitimise_treasure_seekers_reform_title:0 "Legitimise Treasure Seekers"
 kem_legitimise_treasure_seekers_reform_emperor:0 "Legitimise Treasure Seekers"
 kem_legitimise_treasure_seekers_reform_member:0 "Legitimise Treasure Seekers Kharidian Reform"
 kem_legitimise_treasure_seekers_reform_desc:0 "Adventurers will steal everything not nailed down. If we have keep some moderately-precious items conspicuously not nailed down, our more precious artefacts should be less vulnerable. The small financial loss can be compensated by the expertise and power these adventurers bring."
 
 kem_eliminate_the_soul_obelisks_reform_title:0 "Eliminate the Soul Obelisks"
 kem_eliminate_the_soul_obelisks_reform_emperor:0 "Eliminate the Soul Obelisks"
 kem_eliminate_the_soul_obelisks_reform_member:0 "Eliminate the Soul Obelisks Kharidian Reform"
 kem_eliminate_the_soul_obelisks_reform_desc:0 "The Devourer's handiwork is behind the Soul Obelisks, which drain from our citizenry for unknown ends. If Amascut was kept at bay for a time we could work on more permanently dismantling them."
 
 kem_burial_rites_reform_title:0 "Burial Rites"
 kem_burial_rites_reform_emperor:0 "Burial Rites"
 kem_burial_rites_reform_member:0 "Burial Rites Kharidian Reform"
 kem_burial_rites_reform_desc:0 "In the Second Age, burial rites for Pharoahs was an extremely elaborate process, one which has become rather simplified over the centuries. Restore the full rites, and ensure that Pharoahs never truly die, but ascend to eternal glory!"
