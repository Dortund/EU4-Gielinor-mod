l_english:
 giu_monopoly_privileges.1.t:0 "Extension of the Monopoly on Fish"
 giu_monopoly_privileges.1.d:0 "The monopoly on fish we granted to the [Root.GetAdmiralsName] has expired, meaning that we are now able to reclaim the income from our fish production. However, the [Root.GetAdmiralsName] are keen to keep their privileges and are offering to pay us a lump sum in return for the monopoly being guaranteed for a further 10 years."
 giu_monopoly_privileges.1.a:0 "Let us extend the monopoly."
 giu_monopoly_privileges.1.b:0 "Not now."
 giu_monopoly_privileges.1.b.tooltip:0 "We will be able to revoke the §YMonopoly on Fish§! estate privilege."
 
