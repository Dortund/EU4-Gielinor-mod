l_english:
 northern_pantheon_events.1.t:0 "Decline of the Northern Pantheon"
 northern_pantheon_events.1.d:0 "The Fremennik have a complicated mixture of beliefs and legends, but as the Fremennik lands begin to consolidate, so too have the religious practices. Increasingly, faith in the old Northern Pantheon is being supplanted with a faith in the more widespread god Guthix."
 northern_pantheon_events.1.a:0 "Old traditions fall; new traditions arise."

 northern_pantheon_events.2.t:0 "Guthixian Fervour Dies Down"
 northern_pantheon_events.2.d:0 "After a powerful spread of Guthixian influence across the Fremennik lands, the rate of conversions has finally died down."
 northern_pantheon_events.2.a:0 "At least we know nothing will ever happen to Guthix."