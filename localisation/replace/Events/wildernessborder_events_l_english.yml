 wildernessborder.309.a:0 "We must deal with this!"
 
 bandit_rebels_demand:0 "Loot provinces"
 bandit_rebels_demand_desc:0 "Bandits are a threat throughout Gielinor, but most notably to regions bordering the Wilderness such as Misthalin, Asgarnia and the Troll Country."
 bandit_rebels_title:0 "Bandits"
 bandit_rebels_name:0 "Bandits"
 bandit_rebels_desc:0 "Bandits can appear in provinces bordering the Wilderness of at least level four severity. They may not seek regime change, but can deal considerable damage."
 bandit_rebels_army:0 "Bandit Army"
 
 
 wildernessborder.401.t:0 "An Outlaw on the Wilderness Border"
 wildernessborder.401.d:0 "The Wilderness is virtually impossible to police, and criminals who can brave the horrors within frequently cross the border in and out to evade justice. One such outlaw is known to prowl the border of [wildyborder401_target.GetName] and local people demand justice."
 wildernessborder.401.a:0 "Keep the border safe and ensure the outlaw cannot return."
 wildernessborder.401.b:0 "Sooner or later their reckless lifestyle will kill the outlaw."
 wildernessoutlaw_solo_spreadinstitution:0 "The outlaw will find a home in the Wilderness, bringing knowledge of our institutions with them."
