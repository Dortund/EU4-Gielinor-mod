 wildernessborder.409.t:0 "Vast Outlaw Bands on the Wilderness Border"
 wildernessborder.409.d:0 "The Wilderness is virtually impossible to police, but the local people of [wildyborder409_target.GetName] fear the government of [Root.GetName] are not even trying. Vast outlaw bands slip in and out of the Wilderness with ease and soon the wealth of [wildyborder409_target.GetName] will be depleted."
 wildernessborder.409.a:0 "Aggressively guard the border from returning outlaws."
 wildernessborder.409.b:0 "Leave the outlaws to kill each other off."
 wildernessborder.410.t:0 "Outlaw Exiles Bring Knowledge"
 wildernessborder.410.d:0 "The Wilderness is far from the laws and enforcement of most realms, so many outlaws choose to settle within it. Another group of outlaws has joined our realm, bringing with them knowledge of recent technologies."
 wildernessborder.410.a:0 "Excellent!"
 
 