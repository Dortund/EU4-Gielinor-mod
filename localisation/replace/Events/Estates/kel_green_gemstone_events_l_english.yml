l_english:
 kel_green_gemstone_estate_events.1.t:0 "Revolt of the [Root.GetName] $ESTATE_KEL_GREEN_GEMSTONE$"
 kel_green_gemstone_estate_events.1.d:0 "In the opinion of the $ESTATE_KEL_GREEN_GEMSTONE$'s director, the role of the [Root.Monarch.GetTitle] of [Root.GetName] is to leave the Consortium's trading companies to handle their own affairs. To directly seize holdings by the $ESTATE_KEL_GREEN_GEMSTONE$ is a violation of Keldagrim's governance and has been met in turn with violent unrest."
 kel_green_gemstone_estate_events.1.a:0 "Ok."