l_english:
 workers_estate_events.1.t:0 "Revolt of the [Root.GetName] $ESTATE_WORKERS$"
 workers_estate_events.1.d:0 "Appalled at the loss of their privileges the $ESTATE_WORKERS$ of the [Root.GetName] province have taken up arms against us!"
 workers_estate_events.1.a:0 "Ok."

 workers_estate_events.2.t:0 "Advancement of the $ESTATE_WORKERS$"
 workers_estate_events.2.d:0 "The $ESTATE_WORKERS$ are hardly known for their great political power, and yet somehow their influence in the court has grown. How exactly is unclear, but it seems there is a cultural moment for the wealthy elites to pretend to be invested in manual labour."
 workers_estate_events.2.a:0 "Ok."
 EST_VAL_WORKERS_ADVANCE:0 "Advancement of the Workers: §Y$VAL$%§!"
 EST_VAL_WORKERS_ADVANCE_20:0 "Advancement of the Workers: §Y$VAL$%§!"
 
 workers_estate_events.3.t:0 "Declining Relevance of the $ESTATE_WORKERS$"
 workers_estate_events.3.d:0 "There is never much time afforded to the poor, and of late the $ESTATE_WORKERS$ seem to be getting even less attention than normal."
 workers_estate_events.3.a:0 "Ok."
 EST_VAL_WORKERS_DECLINE:0 "Decline Relevance of Worker Representatives: §Y$VAL$%§!"
 
 workers_estate_events.4.t:0 "Freedom of the Land"
 workers_estate_events.4.d:0 "A strange proposal has been floated in [potentially_free_city.GetCapitalName]. Supposedly the $ESTATE_WORKERS$ will produce more if we do not try and closely monitor their every action and meticulously control their workday. Still, giving the $ESTATE_WORKERS$ more freedom also means granting them more power."
 workers_estate_events.4.a:0 "Guarantee the freedom of the land in [potentially_free_city.GetCapitalName]."
 workers_estate_events.4.b:0 "What are the $ESTATE_WORKERS$ to tell us what to do?"
 EST_VAL_FREEDOM_OF_LAND_DENIED:0 "Denied Freedom of the Land: §Y$VAL$%§!"
 
 workers_estate_events.5.t:0 "Anti-Corruption Drive"
 workers_estate_events.5.d:0 "The $ESTATE_WORKERS$, never being the beneficiaries of corruption, are the first to voice alarm at its growing presence. A representative of the $ESTATE_WORKERS$ requests [Root.Monarch.GetTitle] to work with them on tackling the issue; their near-invisibility to elites allows them to enter places and eavedrop on conversations others cannot."
 workers_estate_events.5.a:0 "Sounds like a plan."
 workers_estate_events.5.b:0 "Corruption is an elite problem! It needs an elite solution!"
 workers_estate_events.5.c:0 "I will personally handle this!"
 EST_VAL_ANTI_CORRUPTION_DRIVE:0 "Anti-Corruption Drive: §Y$VAL$%§!"
 EST_VAL_REFUSED_ANTI_CORRUPTION_DRIVE:0 "Refused Anti-Corruption Drive: §Y$VAL$%§!"
 
 workers_estate_events.6.t:0 "The Great Project of [great_project_in_progress.GetName]"
 workers_estate_events.6.d:0 "A great portion of our $ESTATE_WORKERS$ are engaged in an enormous construction project in [great_project_in_progress.GetName]. One of their representatives bemoans the exacting rules placed upon their efforts and has argued that the construction would be done much faster if overseers weren't constantly looking over their shoulder."
 workers_estate_events.6.a:0 "Loosen the reins on the $ESTATE_WORKERS$."
 workers_estate_events.6.b:0 "The construction will be finished when it's finished."
 workers_estate_events.6.c:0 "We can ease up on the $ESTATE_WORKERS$ in subtler ways."
 workers_estate_events.6.e:0 "There's a lot we can learn about construction from the $ESTATE_WORKERS$!"
 workers_estate_events.6.f:0 "Get it built quicker?! Why would I want to do that?"
 EST_VAL_GREAT_PROJECT_ASSISTANCE:0 "Great Project Assistance: §Y$VAL$%§!"
 EST_VAL_SIDELINED_FROM_CONSTRUCTION:0 "Sidelined From Construction: §Y$VAL$%§!"
 
 workers_estate_events.7.t:0 "Violent Unrest Among the $ESTATE_WORKERS$"
 workers_estate_events.7.d:0 "Relations between the state and the $ESTATE_WORKERS$ has reached a nadir. Showing disdain to what they see as constant attempts at sidelining their influence, the $ESTATE_WORKERS$ demand greater freedom in their stronghold of [worker_protests.GetName]."
 workers_estate_events.7.a:0 "$ESTATE_WORKERS$ need to stay in line!"
 workers_estate_events.7.b:0 "Concede to their demands."
 
 workers_estate_events.8.t:0 "New Workshops in [workshop_incoming.GetName]"
 workers_estate_events.8.d:0 "The $ESTATE_WORKERS$ of [workshop_incoming.GetName] have never been so prosperous. With funds of their own to spend, some has been reinvested in expanded production infrastructure."
 workers_estate_events.8.a:0 "Excellent!"
 
 workers_estate_events.9.t:0 "Mistreatment of the $ESTATE_WORKERS$"
 workers_estate_events.9.d:0 "Taking a circuitous route home from a long day at work, one of our $ESTATE_WORKERS$ found themselves in the midst of an elite neighbourhood controlled by $ESTATE_NOBLES$. This incident has ignited fury among the $ESTATE_WORKERS$ and $ESTATE_NOBLES$ alike; the former viewing it as a wholly disproportionate response and the latter viewing it as yet another incidence of increasingly-lax discipline."
 workers_estate_events.9.a:0 "Side with the $ESTATE_WORKERS$."
 workers_estate_events.9.b:0 "Side with the $ESTATE_NOBLES$."
 EST_VAL_WORKERS_AUTHORITY_ASSERTED:0 "Worker Rights Asserted: §Y$VAL$%§!"
 EST_VAL_WORKERS_AUTHORITY_QUESTIONED:0 "Worker Rights Questioned: §Y$VAL$%§!"
 
 workers_estate_events.10.t:0 "Elites and the Upstarts"
 workers_estate_events.10.da:0 "The time has come to pay tribute to the people of [Root.GetName]. But there are so many people, and only so much time for speechcraft. Shall we emphasise the elite power of $ESTATE_NOBLES$ and $ESTATE_BURGHERS$, or perhaps pay tribute to the less traditional $ESTATE_ADMIRALS$ and $ESTATE_WORKERS$?"
 workers_estate_events.10.db:0 "The time has come to pay tribute to the people of [Root.GetName]. But there are so many people, and only so much time for speechcraft. Shall we emphasise the elite power of $ESTATE_NOBLES$, $ESTATE_BURGHERS$ and $ESTATE_CLERGY$, or perhaps pay tribute to the less traditional $ESTATE_ADMIRALS$ and $ESTATE_WORKERS$?"
 workers_estate_events.10.a:0 "Celebrate our traditional strengths."
 workers_estate_events.10.b:0 "Celebrate our new minds."
 workers_estate_events.10.c:0 "Are we not all people of [Root.GetName]?"