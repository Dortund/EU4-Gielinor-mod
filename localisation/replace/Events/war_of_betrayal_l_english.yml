l_english:
 war_of_betrayal.1.t:0 "War of Betrayal"
 war_of_betrayal.1.d:0 "Since Varlamore was founded, it has never found itself at war with Kourend in the north - until now. Such a change in course has alarmed the citizenry of both nations and violence has erupted throughout the Shining Kingdom..."
 war_of_betrayal.1.a:0 "Kourend must fall and I will crush anyone that stands in my way!"
 war_of_betrayal_loyalist_tooltip:0 "Lead the §YLoyalist§! side of the §YWar of Betrayal§!"
 war_of_betrayal.1.b:0 "The war must end, and [Root.Monarch.GetTitle] [Root.Monarch.GetName]'s rule with it!"
 war_of_betrayal_resistance_tooltip:0 "Lead the §YResistance§! side of the §YWar of Betrayal§!"
 VAR_betrayal_severely_early:0 "Due to starting this disaster in the §RAge of Mortals§! you will also receive the following penalties:"
 VAR_betrayal_substantially_early:0 "Due to starting this disaster in the §RAge of Humans§! you will also receive the following penalties:"
 
 war_of_betrayal.2.t:0 "Fate of the Temple of Twilight"
 war_of_betrayal.2.d:0 "The bizarre choices of the monarch seem to have a connection to the bizarre Temple of Twilight, where teachings many consider heretical have taken place. The people cry out to purge this monument to evil."
 war_of_betrayal.2.a:0 "Shut down the temple!"
 war_of_betrayal.2.b:0 "It's just a building."
 
 war_of_betrayal.3.t:0 "Assault on the Temple of Twilight"
 war_of_betrayal.3.d:0 "The rebels to [Root.Monarch.GetTitle] [Root.Monarch.GetName]'s rule have assaulted the Temple of Twilight! This is a site of crucial religious insight but defending it could take precious resources we cannot afford to spare from our war effort."
 war_of_betrayal.3.a:0 "Divert funds to securing the Temple."
 VAR_secured_temple_investment_tooltip:0 "The Temple of Twilight will not be at risk of destruction for the remainder of the War of Betrayal."
 war_of_betrayal.3.b:0 "It's just a building."
 
 war_of_betrayal.4.t:0 "A Hope for Peace"
 war_of_betrayal.4.d:0 "To the forces of Kourend, they are at war with Varlamore and do not easily distinguish our rebels from the loyalist forces. If we send an emissary we could bring the external war to an end, but we would have to grant assurances this situation will never repeat itself."
 war_of_betrayal.4.a:0 "Send a generous peace offer."
 VAR_generous_peace_offer_tooltip:0 "If the peace offer is declined, the money and diplomatic power will be returned to us. A computer-controlled country will always accept this offer."
 war_of_betrayal.4.b:0 "We cannot afford to make such an offer."
 
 war_of_betrayal.5.t:0 "The Varlamore Resistance"
 war_of_betrayal.5.d:0 "It appears we are not the only people shocked by the actions of Varlamore's leadership. There is a brewing resistance movement which promises to grant us compensation if we agree to stand aside from the war."
 war_of_betrayal.5.a:0 "Accept the offer."
 war_of_betrayal.5.b:0 "Reject the offer."
 
 war_of_betrayal.6.t:0 "Alarmed Subjects"
 war_of_betrayal.6.d:0 "Much as our war with Kourend alarmed those in Varlamore without vision, it has also upset the narrow-minded within our subject provinces. We could placate them for a time with more autonomy, or have a show of force. "
 war_of_betrayal.6.a:0 "Keep the subjects in line with temporary autonomy."
 war_of_betrayal.6.b:0 "We do not care for their petty pleas."
 
 war_of_betrayal.7.t:0 "Kourendite Landing"
 war_of_betrayal.7.da:0 "Our Kourendite enemies have landed in Varlamore! Surely now the people can see the real threat we face."
 war_of_betrayal.7.db:0 "Kourendite forces have landed upon Varlamore's shores. Unfortunately, they do not distinguish between the loyalists and the resistance and both parties are alarmed at this development."
 war_of_betrayal.7.a:0 "This proves the need for further recruitment!"
 war_of_betrayal.7.b:0 "This common threat will lower violence between the people of Varlamore."
 
 war_of_betrayal.100.t:0 "End of the War of Betrayal"
 war_of_betrayal.100.da:0 "Our actions against Kourend were just, and as was the treatment of our people. Varlamore stands united under the true faith of Losanium and let all of Gielinor know it!"
 war_of_betrayal.100.db:0 "Whatever possessed the old monarch to betray Varlamore's history is unclear, but what is clear is we need more safeguards going forward. The sun rises again on a stronger, and more weary, Varlamore."
 war_of_betrayal.100.dc:0 "The heroic resistance failed to push back whatever horror possessed the monarch. Varlamore has an unsetting future ahead of it..."
 war_of_betrayal.100.dd:0 "The accursed resistance has defeated a perfectly just monarch, which was only trying to follow the path of Losanium! Heresy! Heresy..."
 war_of_betrayal.100.a:0 "Ximoua beckons..."
 war_of_betrayal.100.b:0 "The light shines upon us today."
 war_of_betrayal.100.c:0 "Let's hope Ximoua hasn't come early."
 war_of_betrayal.100.e:0 "This new government can't last forever."