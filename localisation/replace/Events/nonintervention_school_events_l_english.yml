l_english:
 nonintervention_school_events.1.t:0 "The Teachings of [Root.GetName]"
 nonintervention_school_events.1.da:0 "To not follow a God is to decide one of many different paths for ourselves. Let us decide our guiding philosophy!"
 nonintervention_school_events.1.db:0 "Many Guthixians spent the God Wars isolated from the rest of the world, creating unique distinct traditions in the following of Guthix. Which path should we follow?"
 nonintervention_school_events.1.dc:0 "Legends become myth, and myths never quite stay the same way from one village to the next. There are many ways to interpret V - which shall we choose?"
 nonintervention_school_events.1.a:0 "Choose for me."
 nonintervention_school_events.1.godless.a:0 "The Gods and their churches should be torn asunder."
 nonintervention_school_events.1.godless.b:0 "We should aim to preach the positive elements of mortals."
 nonintervention_school_events.1.godless.c:0 "We shouldn't need to think too hard about this."
 nonintervention_school_events.1.godless.d:0 "Argh! The Gods are out to get us!"
 nonintervention_school_events.1.godless.e:0 "We are better than these so-called Gods."
 nonintervention_school_events.1.guthix.a:0 "Our people's history shall guide us."
 nonintervention_school_events.1.guthix.b:0 "Guthix is the god of peace."
 nonintervention_school_events.1.guthix.c:0 "Our goal is to serve the Guardians of Guthix."
 nonintervention_school_events.1.guthix.d:0 "Balance is a goal to which we must actively strive!"
 nonintervention_school_events.1.guthix.e:0 "Guthix doesn't really matter, it's all just a means to an end."
 nonintervention_school_events.1.v.a:0 "V is our shield."
 nonintervention_school_events.1.v.b:0 "V brought magic to a world deprived of it."
 nonintervention_school_events.1.v.c:0 "V was a glorious warrior who needed no magic to crush his enemies!"