l_english:
 corruption_of_amascut.1.t:0 "Corruption of Amascut"
 corruption_of_amascut.1.d:0 "As corruption has grown in [Root.GetName], so too has Amascut's power. What began as random sightings of glowing scarabs and the occasional missing person has ballooned into outright warfare as undead thralls march upon [amascut_invasion_city.GetCapitalName]. It looks as though Amascut plans to take personal control of [Root.Monarch.GetTitle] [Root.Monarch.GetName]."
 corruption_of_amascut.1.a:0 "I cannot fight this!"
 corruption_of_amascut.1.b:0 "We must fight for our souls!"
 
 corruption_of_amascut.2.t:0 "Amascutite Recruitment"
 corruption_of_amascut.2.d:0 "Those who fall to Amascut's corruption can quickly be used to fuel her forces, forcing us to fight our own subjects. One fresh army has emerged in [amascut_recruitment_city.GetCapitalName]."
 corruption_of_amascut.2.a:0 "We can mourn the dead later - for now we must fight!"
 corruption_of_amascut.2.b:0 "Keep damages to a minimum."
 
 corruption_of_amascut.3.t:0 "Prayers to Icthlarin"
 corruption_of_amascut.3.d:0 "Our $ESTATE_CHURCH$ are trying hard to purify Amascut's corruption in [purify_city_from_amascut.GetName]. With additional resources they may be able to accelerate the process."
 corruption_of_amascut.3.a:0 "Provide the $ESTATE_CHURCH$ with what they need."
 corruption_of_amascut.3.b:0 "We should focus on the root cause of the corruption."
 
 corruption_of_amascut.4.t:0 "Contradictions of $MONARCHTITLE$ $MONARCH$"
 corruption_of_amascut.4.d:0 "There is considerable alarm among the court as [Root.Monarch.GetTitle] [Root.Monarch.GetName] appears to still consider Amascut [Root.Monarch.GetHerHis] personal deity in the wake of open warfare against her."
 corruption_of_amascut.4.a:0 "Perhaps it is time to switch allegiance..."
 corruption_of_amascut.4.b:0 "I follow the idea of Amascut, not the Devourer who took her place!"
 corruption_of_amascut.4.c:0 "I follow Amascut, right or wrong!"
 
 corruption_of_amascut.5.t:0 "Soul Obelisks"
 corruption_of_amascut.5.d:0 "One of the many tools Amascut's forces use to amass power is the Soul Obelisk - an object that can be summoned into cities to drain the souls of nearby civilians. To destroy them typically requires a blood sacrifice. With the appearance of a new soul obelisk, we must decide on a course of action."
 corruption_of_amascut.5.a:0 "Shut that soul obelisk down!"
 corruption_of_amascut.5.b:0 "We cannot spare manpower for this."
 
 corruption_of_amascut.6.t:0 "Divine Intervention"
 corruption_of_amascut.6.da:0 "In the struggle against Amascut, we are not without aid. It appears Apmeken's divine favour is shining upon us, strengthening our people's resolve."
 corruption_of_amascut.6.db:0 "In the struggle against Amascut, we are not without aid. It appears Crondis' divine favour is shining upon us, strengthening our people's resolve."
 corruption_of_amascut.6.dc:0 "In the struggle against Amascut, we are not without aid. It appears Elidinis' divine favour is shining upon us, strengthening our people's resolve."
 corruption_of_amascut.6.dd:0 "In the struggle against Amascut, we are not without aid. It appears Het's divine favour is shining upon us, strengthening our people's resolve."
 corruption_of_amascut.6.de:0 "In the struggle against Amascut, we are not without aid. It appears Icthlarin's divine favour is shining upon us, strengthening our people's resolve."
 corruption_of_amascut.6.df:0 "In the struggle against Amascut, we are not without aid. It appears Scabaras' divine favour is shining upon us, strengthening our people's resolve."
 corruption_of_amascut.6.dg:0 "In the struggle against Amascut, we are not without aid. It appears Tumeken's divine favour is shining upon us, strengthening our people's resolve." 
 corruption_of_amascut.6.a:0 "That's what friends are for!"
 corruption_of_amascut.6.b:0 "Modesty is a good counter to corruption..."
 corruption_of_amascut.6.c:0 "Let the Elid cleanse this corruption!"
 corruption_of_amascut.6.d:0 "Healthy mind, harder to corrupt!"
 corruption_of_amascut.6.e:0 "Of course we'd have the Protector of Souls backing us up!"
 corruption_of_amascut.6.f:0 "Even the God of Isolation cannot stand idly by!"
 corruption_of_amascut.6.g:0 "In the light of the sun, corruption shall burn."
 
 corruption_of_amascut.7.t:0 "Corrupted Scarabs"
 corruption_of_amascut.7.d:0 "Mysterious beetles have appeared in [corrupted_scarab_city.GetName], seemingly crawling from depths below. They spread corruption and those who attempt to squish them become injured in the process. Curiously, however, they seem to all carry gold..."
 corruption_of_amascut.7.a:0 "Close off the routes to these scarabs and quickly squish the rest!"
 corruption_of_amascut.7.b:0 "If we act slowly we could make a lot of money from these scarabs..."
 corruption_of_amascut.7.c:0 "What if we shared responsibility for squishing scarabs and the rewards among the citizenry?"
 corruption_of_amascut.7.e:0 "Myself and my personal guard will handle this personally!"
 
 corruption_of_amascut.8.t:0 "Dual Attack"
 corruption_of_amascut.8.d:0 "Forces of corruption have split their efforts into two separate assaults, likely in the hopes of securing at least one province for Amascut before relief can arrive."
 corruption_of_amascut.8.a:0 "We will stop them both!"
 
 corruption_of_amascut.9.t:0 "Repent the Corruption"
 corruption_of_amascut.9.d:0 "The $ESTATE_CHURCH$ calls on $MONARCHTITLE$ $MONARCH$ to take responsibility for the corruption rife in $COUNTRY$ that drew in Amascut's attacks. Repentence is a good way to win divine favour and in turn cleanse some corruption, but it will weaken the $MONARCHTITLE$'s political power."
 corruption_of_amascut.9.a:0 "Repent!"
 corruption_of_amascut.9.b:0 "Corruption isn't the responsibility of just one person!"
 corruption_of_amascut.9.c:0 "I do not need the $ESTATE_CHURCH$ to be an intermediary for justice."
 corruption_of_amascut.9.e:0 "Repent harder!"
 
 corruption_of_amascut.10.t:0 "Vulnerability of the $ESTATE_WORKERS$"
 corruption_of_amascut.10.d:0 "With minimal security and access to weaponry, our $ESTATE_WORKERS$ are particularly vulnerable to the attacks of Amascut. With corruption beginning to spread in a part of [workers_vulnerable_to_amascut.GetName] with a high population of $ESTATE_WORKERS$, we must decide whether we can spare them the resources or not."
 corruption_of_amascut.10.a:0 "Spare what we can!"
 corruption_of_amascut.10.b:0 "We cannot help the $ESTATE_WORKERS$."
 
 corruption_of_amascut.100.t:0 "End of Amascut's War"
 corruption_of_amascut.100.da:0 "Amascut's power overwhelmed [Root.GetName], leaving [Root.Monarch.GetTitle] [Root.Monarch.GetName] little more than a thrall to serve her ambitions. Perhaps great power will be found by Amascut's side, or there will be an opportunity to break free once more..."
 corruption_of_amascut.100.db:0 "The Devourer has failed to take [Root.GetName] and has retreated for the time being."
 corruption_of_amascut.100.dc:0 "The war against Amascut has suddenly ended as Amascut has surrendered to Icthlarin!"
 corruption_of_amascut.100.a:0 "Amascut has triumphed!"
 corruption_of_amascut.100.b:0 "Hopefully that's the last we see of Amascut's forces."
 corruption_of_amascut.100.c:0 "We are saved!"
 all_amascut_converts_to_menaphite_tooltip:0 "All provinces following the §YAmascutite§! faith have converted to the §YMenaphite§! faith."
 