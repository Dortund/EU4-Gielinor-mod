l_english:
 flavor_mce.1.t:0 "Reform of the Miscellanian Monarchy"
 flavor_mce.1.d:0 "Gielinor is changing and our governing structure needs to change to keep up. We cannot afford to remain isolated among the upheaval of adventurers breaking out every sealed monster and investigating every locked door."
 flavor_mce.1.a:0 "We should work with these adventurers."
 flavor_mce.1.b:0 "We should look for the governing structures of other realms."
 flavor_mce.1.c:0 "Why change anything?"

