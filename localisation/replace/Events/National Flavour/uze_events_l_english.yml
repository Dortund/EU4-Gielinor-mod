 flavor_uze.1.t:0 "The Religious Direction of Uzer"
 flavor_uze.1.d:0 "Uzer historically was a religiously diverse city with a reputation for tolerance. Perhaps it is worth considering reviving one of the old faiths?"
 flavor_uze.1.a:0 "The Menaphite Pantheon has served Kharid well in the intervening centuries."
 flavor_uze.1.b:0 "Following Saradomin could gain us favour with kingdoms outside Kharid."
 flavor_uze.1.c:0 "Justice and tolerance are intrinsically linked. Let us follow Armadyl."
 flavor_uze.1.e:0 "Chaos is not merely destructive; there is opportunity as well."