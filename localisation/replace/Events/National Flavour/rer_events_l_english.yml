 flavor_rer.1.t:0 "Rise of the Red Reef Trading Company"
 flavor_rer.1.d:0 "A young entrepreneur by the name of Spencer Brentwood has discovered a form of red coral with strange divinational properties. He has set up a base on a nearby sandbank under the name of the Red Reed Trading Company."
 flavor_rer.1.a:0 "I see the future, and it's with the Red Reef Trading Company!"
 flavor_rer.1.b:0 "This sounds like a bad idea..."