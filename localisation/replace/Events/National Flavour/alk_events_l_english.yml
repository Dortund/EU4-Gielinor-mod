l_english:
 flavor_alk.1.t:0 "Depopulation of the Plateau"
 flavor_alk.1.d:0 "With the settlement and growth of Al Kharid, many of the residents of the Kharidian highlands have moved to the lowlands to seek their fortune. While this movement will make Al Kharid even more powerful, it will leave the highlands distinctly unpopulated."
 flavor_alk.1.a:0 "Shame. I was growing rather attached to the plateau."
 flavor_alk.1.b:0 "We could mitigate this issue with concessions to the local hill giants."
 
 flavor_alk.2.t:0 "The Mage Training Arena"
 flavor_alk.2.d:0 "Runecrafting has brought the magical arts across the world, but new wizards frequently mishandle spells and die in the process. With the recent discovery of the Fire Altar in Al Kharid, and plenty of unused land, wizards are proposing we host an arena for magic training. However, there are many competing groups of wizards all asking that the arena teaches according to their own views..."
 flavor_alk.2.a:0 "Implement the Blue Wizards' proposal."
 flavor_alk.2.b:0 "Implement the Red Wizards' proposal."
 flavor_alk.2.c:0 "Implement the Green Wizards' proposal."
 flavor_alk.2.e:0 "We'll make this arena ourselves!"
 
 flavor_alk.3.t:0 "Soldiers to Smiths"
 flavor_alk.3.d:0 "As our people have settled in the city of Al Kharid, their priorities have shifted. More permanent buildings allow the pass to the southern desert to be more easily guarded, and consequentially many soldiers have shifted to new professions - particularly in the field of smithing."
 flavor_alk.3.a:0 "They can still fight if we need them to, right?"
 
 flavor_alk.4.t:0 "The Spirit Anglers"
 flavor_alk.4.d:0 "The fishers and sailors of the eastern Unquiet Ocean speak of a terrible ancient creature known as Tempoross, made out of the sea itself and capable of conjuring storms. To defeat it, some of our own sailors have established the Spirit Anglers, and request we fund their expedition to a staging ground closer to Tempoross - the Ruins of Unkah should do nicely."
 flavor_alk.4.a:0 "The Spirit Anglers shall have their funding!"
 flavor_alk.4.b:0 "We cannot afford this."
 
 flavor_alk.5.t:0 "Magical Specialities"
 flavor_alk.5.d:0 "The study of four types of magic has been advanced in our city. But which one should we emphasise?"
 flavor_alk.5.a:0 "Telekinesis!"
 flavor_alk.5.b:0 "Bones Conversion!"
 flavor_alk.5.c:0 "Enchanting!"
 flavor_alk.5.e:0 "Alchemy!"

 flavor_alk.6.t:0 "Corruption of the Duel Arena"
 flavor_alk.6.d:0 "Something suspicious is happening at the Duel Arena. Once a place of honourable combat, increasingly the grounds are overrun by gamblers - and match-fixers. Now known under the derogatory nickname of the Sand Casino, the Duel Arena has brought shame upon [Root.GetName]."
 flavor_alk.6.a:0 "We must step up our efforts to crush this corruption!"
 flavor_alk.6.b:0 "This can continue so long as we get a cut."
 
 flavor_alk.7.t:0 "A Reformer's Work is Never Done"
 flavor_alk.7.d:0 "Our incredible success in taking the throne of Kharid is undercut somewhat by our incomplete efforts to improve our government. To this end, we have incorporated our reform-minded administrators into the bureaucracy of the Empire of Kharid."
 flavor_alk.7.a:0 "Try to keep up!"
 alk_can_carry_on_reform_tooltip:0 "This special government reform can be replaced once all §YKharidian Emergence§! reforms are completed."
 
 flavor_alk.8.t:0 "Completion of Reformers' Research"
 flavor_alk.8.d:0 "We have finally completed the efforts to learn about administrating a kingdom - and now an empire - from other nations. Such efforts have made our bureaucrats rather effective at problem-solving, so perhaps we should continue a policy of looking for outside ideas?"
 flavor_alk.8.a:0 "A reformer's work is never done."
 unlock_open_imperial_administration_reform:0 "Unlock the §YOpen Imperial Administration§! reform."
 
 flavor_alk.9.t:0 "Heirs of Hallowvale"
 flavor_alk.9.d:0 "The people of Morytania were surprised to say the least at our arrival. What omen could our arrival bring - are we destined to rebuild the Kingdom of Hallowvale?"
 flavor_alk.9.a:0 "We shall be the torch in the darkness!"
 alk_hallowvale_route_tooltip:0 "We will gain the ability to form @HVL §Y[HVL.GetName]§! without the usual culture requirements."
 kem_not_allowed_tooltip:0 "We will no longer be able to form the @KEM §Y[KEM.GetName]§!."
 flavor_alk.9.b:0 "Hallowvale is not our home."