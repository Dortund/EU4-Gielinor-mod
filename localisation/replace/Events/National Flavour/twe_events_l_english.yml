 flavor_twe.1.t:0 "Restoration of the Temple of Twilight"
 flavor_twe.1.d:0 "The Temple of Twilight, built above the Ruins of Tapoyauik, stands as a testament to those who sought to find forbidden knowledge - but has unfortunately been left to disrepair. However, the Twilight Emissaries are driven to restore the Temple to its former glory!"
 flavor_twe.1.a:0 "Excellent!" 