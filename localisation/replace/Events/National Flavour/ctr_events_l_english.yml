l_english:
 flavor_ctr.1.t:0 "Runes of Cam Torum"
 flavor_ctr.1.d:0 "Cam Torum is the sole supplier of runes in Varlamore, but the secret of where these runes are sourced from is so tightly controlled that we are limited in our capacity to research magic. An investment into expanding our supplies of runes could rectify this problem but risks revealing our secrets."
 flavor_ctr.1.a:0 "The craft of the Imcando deserves full funding!"
 flavor_ctr.1.b:0 "Keep the investment modest."
 flavor_ctr.1.c:0 "Let us keep our secrets."