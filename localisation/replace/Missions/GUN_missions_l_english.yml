l_english:
 GUN_down_with_the_moon_clan_title:0 "Down with the Moon Clan!"
 GUN_down_with_the_moon_clan_desc:0 "The Moon Clan, traitors to the Fremennik and the worst perpetuators of the evils of Runecrafting, must be brought to heel."
 GUN_beyond_the_lunar_sea_title:0 "Beyond the Lunar Sea"
 GUN_beyond_the_lunar_sea_desc:0 "We know not of the extent the Moon Clan's influence has reached. Perhaps out there beyond the Lunar Sea are yet more runecrafters to crush."
 GUN_power_of_ourania_title:0 "Power of Ourania"
 GUN_power_of_ourania_desc:0 "It is said that the Ourania Altar is the most powerful runecrafting altar of all - all the more reason to destroy it!"

 GUN_supplying_the_invasion_title:0 "Supplying the Invasion"
 GUN_supplying_the_invasion_desc:0 "Fervour will only drive us so far - we need sufficient resources to fund our conquests."
 GUN_lunar_sea_shores_title:0 "Lunar Sea Shores"
 GUN_lunar_sea_shores_desc:0 "Although the bulk of rune altars are to our south-east, the most egregious runecrafters are found on Lunar Isle. We must build a strong enough fleet to bring them down."
 GUN_kandarin_expansion_title:0 "Kandarin Expansion"
 GUN_kandarin_expansion_desc:0 "Rumours of a particularly powerful runecrafting altar deep within Kandarin attracts our interest. We must fight our way towards it."
 GUN_wrath_and_ruin_title:0 "Wrath and Ruin"
 GUN_wrath_and_ruin_desc:0 "Far to the south, beyond the lands of ogres, a small elite force has formed the Sect of Uhld to oppose us! Let us turn their Myths' Guild into a myth itself."

 GUN_fremennik_ally_title:0 "Fremennik Ally"
 GUN_fremennik_ally_desc:0 "Few are interested with siding with our conquests, but if anyone will, it is fellow Fremennik."
 GUN_battle_prowess_title:0 "Battle Prowess"
 GUN_battle_prowess_desc:0 "Our crusaders are not inspired by mere skirmishes, but the defeat of Gielinor's most powerful nations."
 GUN_catherbian_fleet_title:0 "Catherbian Fleet"
 GUN_catherbian_fleet_desc:0 "The power of the Fremennik is on the seas, but the seas south of Catherby do not have a direct link with the Lunar Sea. As such, we must build up a new fleet on the Unquiet Ocean."
 GUN_karamjan_assault_title:0 "Karamjan Assault"
 GUN_karamjan_assault_desc:0 "Runecrafting has found its way even on the island of Karamja. Karamjans have much in common with us Barbarians, particularly in the ways of spear crafting and hunting, so we cannot let them fall to this folly."
 GUN_circumvent_falador_title:0 "Circumvent Falador"
 GUN_circumvent_falador_desc:0 "Falador is a fiercely-defended city, and beyond it lies the air altar... so let's try going around the city instead of through it."
 GUN_fremennik_traditions_title:0 "Fremennik Traditions"
 GUN_fremennik_traditions_desc:0 "Gunnarsgrunn is far from the Fremennik homeland so we must take extra care to develop it as a home away from home, lest our people become assimilated by the Misthalanians."
 GUN_home_of_the_wizards_title:0 "Home of the Wizards"
 GUN_home_of_the_wizards_desc:0 "A large number of wizards have found their way onto a small island near a swamp. How about we get rid of these smelly wizards?"

 GUN_accepted_cultures_for_ai:0 "An AI Gunnar is granted accepted cultures to help nudge them towards a more historical conquest path."

 GUN_raise_the_forces_title:0 "Raise the Forces"
 GUN_raise_the_forces_desc:0 "We must gather all able-bodied people willing to crush those who attempt to steal the Gods' power."
 GUN_towards_white_wolf_title:0 "Towards White Wolf"
 GUN_towards_white_wolf_desc:0 "The bulk of the runecrafting altars exist east of White Wolf Mountain, which has few points of crossing. If we seize Catherby then the way should be opened."
 GUN_cross_the_mountain_title:0 "Cross the Mountain"
 GUN_cross_the_mountain_desc:0 "Over White Wolf Mountain is a group of Guthixian druids. They stand in our way and must be pushed aside."
 GUN_the_mind_altar_title:0 "The Mind Altar"
 GUN_the_mind_altar_desc:0 "The thoughts of the Gods are not intended to be known by mortals who would simply abuse such power."
 GUN_founding_of_gunnarsgrunn_title:0 "Founding of Gunnarsgrunn"
 GUN_founding_of_gunnarsgrunn_desc:0 "A riverside spot in northern Misthalin seems an ideal location to build a new base of operations."
 GUN_misthalanian_warpath_title:0 "Misthalanian Warpath"
 GUN_misthalanian_warpath_desc:0 "The area around Misthalin is for some unknown reason full of runecrafting altars - let us chase them down."
 GUN_destroy_the_training_area_title:0 "Destroy the Training Area"
 GUN_destroy_the_training_area_desc:0 "There is talk of experienced mages teaching whole new generations how to use that power. The world needs to be spared from this danger - and we're sure the apprentices shall appreciate being spared from their relentless training."
 
 GUN_altar_burner_title:0 "Altar Burner"
 GUN_altar_burner_desc:0 "Let us show commitment to the crusaders' cause! A great invasion will sweep across Gielinor by our hand!"
 GUN_stabilisation_title:0 "Stabilisation"
 GUN_stabilisation_desc:0 "The warpath cannot last forever - either we fail, face indefinite resistance or run out of path. We need to begin to prepare for the long term - and it starts by getting our realm in order."
 GUN_crusaders_triumphant_title:0 "Crusaders Triumphant"
 GUN_crusaders_triumphant_desc:0 "Runecrafting stretches further across Gielinor than we could have ever imagined. Our task seems insurmountable - but imagine the stories we could tell if we succeeded! Imagine the legends passed through the centuries of Gunnar Viljarsson and the world he changed forever!"
 GUN_destruction_of_camdozaal_title:0 "Destruction of Camdozaal"
 GUN_destruction_of_camdozaal_desc:0 "The dwarves we know in Keldagrim do not use magic, aside from the occasional superheat. But in Asgarnia, there are dwarves that merge spellcrafting with smithing - an affront to true warriors of Gielinor. Their heresy must be brought to an end."
 GUN_border_of_chaos_title:0 "Border of Chaos"
 GUN_border_of_chaos_desc:0 "From Ice Mountain we can see the telltale signs of an altar to the north-east! If we control enough land nearby we might be able to destroy it with a small force of Barbarians."
 GUN_down_to_earth_title:0 "Down to Earth"
 GUN_down_to_earth_desc:0 "The earth altar thought it could hide from us, tucked away in the corner of Misthalin? Well, it can't."
 