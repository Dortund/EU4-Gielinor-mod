l_english:
 VAR_losanium_faith_title:0 "Losanium Faith"
 VAR_losanium_faith_desc:0 "Faith saved us from Xeric and shall guide us again through any challenges we may face."
 VAR_end_of_the_titans_title:0 "End of the Titans"
 VAR_end_of_the_titans_desc:0 "Cloud Giants are a persistent threat to the citizens of Tempestus - we must force the last of them out!"
 VAR_college_of_bards_mission_title:0 "College of Bards"
 VAR_college_of_bards_mission_desc:0 "The perfect acoustics of Tempestus have begun to attract bards to the region. With some investment, we could really create an ideal place for them."
 VAR_legends_of_varlamore_title:0 "Legends of Varlamore"
 VAR_legends_of_varlamore_desc:0 "Successes within our home region will grant our bards fresh inspiration."
 VAR_cultural_exchange_title:0 "Cultural Exchange"
 VAR_cultural_exchange_desc:0 "Bards are restless! They need to show Gielinor their craft, and learn of new places they may sing about."
 
 VAR_expansion_of_tempestus_title:0 "Expansion of Tempestus"
 VAR_expansion_of_tempestus_desc:0 "Tempestus holds much potential, lacking the rough terrain of other parts of western Varlamore. But potential is nothing without investment."
 VAR_tlati_investment_title:0 "Tlati Investment"
 VAR_tlati_investment_desc:0 "If we are to be serious about including the Talkasti as part of Varlamore, we must be willing to invest in their towns as much as we would in Civitas illa Fortis."
 VAR_war_of_the_rain_title:0 "War of the Rain"
 VAR_war_of_the_rain_desc:0 "The Talkasti's continuing expansion has been halted by demons which can control the weather itself!"
 
 VAR_neighbourly_ties_title:0 "Neighbourly Ties"
 VAR_neighbourly_ties_desc:0 "The last thing we want is rival powers in our home region. We must strengthen our bond with the Talkasti and the Imcando alike."
 VAR_connecting_trade_title:0 "Connecting Trade"
 VAR_connecting_trade_desc:0 "Before we can settle more of our region, we must prove our logistical capabilities are adequate."
 VAR_aldarin_settlement_title:0 "Aldarin Settlement"
 VAR_aldarin_settlement_desc:0 "The isle of Aldarin would be a great addition to Varlamore, and until recently we've lacked the population nor the logistics to settle it effectively."
 VAR_aldarin_settlement_tooltip:0 "A new subject nation of Aldarin will be created. The §YAldarin Investment§! decision becomes available to aid in its expansion."
 VAR_aldarin_red_title:0 "Aldarin Red"
 VAR_aldarin_red_desc:0 "Aldarin's climate is perfect for vinyards. Expand the colony, and we can grow the finest of grapes for the most wonderous wines."
 VAR_new_land_rights_title:0 "New Land Rights"
 VAR_new_land_rights_desc:0 "Before we are able to expand our direct holdings further, we must not upset the estates who risk losing power in a larger nation."
 VAR_integration_of_varlamore_title:0 "Integration of Varlamore"
 VAR_integration_of_varlamore_desc:0 "Local leadership in Aldarin and Auburnvale have served us well for some time, but Civitas illa Fortis is now strong and organised enough to rule these cities directly."
 
 VAR_shipbuilding_title:0 "Shipbuilding"
 VAR_shipbuilding_desc:0 "Land-based routes are inadequate for supplying the Tlati Rainforest and Tempestus. Let us build a navy." 
 VAR_salvager_overlook_title:0 "Salvager Overlook"
 VAR_salvager_overlook_desc:0 "While Varlamore's relations with Great Kourend have generally been strong, we must always remain vigilant. Our relatively unpopulated north coast is vulnerable to coastal landings and should be reinforced."
 VAR_settlement_of_auburnvale_title:0 "Settlement of Auburnvale"
 VAR_settlement_of_auburnvale_desc:0 "A stronger navy necessitates a good supply of lumber, and unfortunately most of Varlamore does not provide suitable lumber. The redwood forests to our northwest are tempting, however..."
 VAR_settlement_of_auburnvale_tooltip:0 "A new subject nation of Auburnvale will be created. The §YAuburnvale Investment§! decision becomes available to aid in its expansion."
 VAR_fletching_guild_title:0 "Fletching Guild"
 VAR_fletching_guild_desc:0 "The rich diversity of lumber around Auburnvale makes it an ideal place to experiment with woodcarving. Let us establish the Fletching Guild to promote further development of woodcraft!"
 var_fletching_guild_prosperous_tooltip:0 "Province must be experiencing Prosperity"
 VAR_cothon_expansion_title:0 "Cothon Expansion"
 VAR_cothon_expansion_desc:0 "Coastal defences can slow enemy invasion, but a strong navy will stop it before it can begin. Expanding Fortis Cothon shall allow us to build the strongest navy we can."

 
 VAR_hunters_investment_title:0 "Hunters' Investment"
 VAR_hunters_investment_desc:0 "The ancient Hunters' Guild would benefit from some extra support to continue to provide us with meats and hides."
 VAR_terror_of_the_wyrm_title:0 "Terror of the Wyrm"
 VAR_terror_of_the_wyrm_desc:0 "The Colossal Wyrm casts a shadow over the Avium Savannah. Can anyone defeat it?"
 VAR_victory_of_the_kualti_title:0 "Victory of the Kualti"
 VAR_victory_of_the_kualti_desc:0 "When our ancestors fled the wrath of Xeric, they knew that it was the raw power of the Lizardmen which gave Xeric's forces strength, not their numbers. As such, we should recognise that quality troops are more important than how many we have."
 VAR_kourendite_intervention_title:0 "Kourendite Intervention"
 VAR_kourendite_intervention_desc:0 "Kourend's internal divisions have left them weak. Should we take advantage?"
 VAR_the_road_to_forthos_title:0 "The Road to Forthos"
 VAR_the_road_to_forthos_desc:0 "Forthos, old capital of Hosidius, is also a crucial site in the early development of our religion. With Kourend divided, it is ours for the taking..."