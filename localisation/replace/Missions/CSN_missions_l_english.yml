l_english:
 CSN_heroism_title:0 "Heroism"
 CSN_heroism_desc:0 "To stand up against a stronger foe and yet come out ahead shows determination, and determination shall guide our clan through the coming years."
 CSN_temple_knight_efforts_title:0 "Temple Knight Efforts"
 CSN_temple_knight_efforts_desc:0 "The Temple Knights are an ancient Saradominist order that covertly protects us all from major threats. Perhaps we should seek to emulate them - or join with them."
 CSN_loyalties_of_clan_cashien_title:0 "Loyalties of Clan Cashien"
 CSN_loyalties_of_clan_cashien_desc:0 "No organisation will be interested in our aid if we cannot showcase our power, nor our ability to work with others."
 CSN_ice_mountain_oracles_title:0 "Ice Mountain Oracles"
 CSN_ice_mountain_oracles_desc:0 "Hermits atop Ice Mountain attempt to see the future, but our way to them is complicated by the historical presence of the Imcando Dwarves."
 CSN_may_use_sacred_forge_tooltip:0 "Enables the use of the §YSacred Forge§! monument without the usual restrictions."
 CSN_heart_of_asgarnia_title:0 "Heart of Asgarnia"
 CSN_heart_of_asgarnia_desc:0 "Farradorn's conquest gives us more direct access to the Temple Knights allowing us to truly bring our Clan and their operatives together."
 csn_whispered_secrets_mission_tooltip:0 "The Temple Knights are likely to give us a §Ydifficult final test.§!"
 