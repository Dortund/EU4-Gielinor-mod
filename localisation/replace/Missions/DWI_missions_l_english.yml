l_english:
 DWI_ally_urval_title:0 "Ally Urval"
 DWI_ally_urval_desc:0 "Urval the Exile has founded a druidic order that believes Zamorak to be the greatest realisation of Guthixian ideals. This line of thought is obviously nonsense but there are not a lot of Zamorakians in Asgarnia right now - we need what we can get."
 DWI_riches_of_deofolwitga_title:0 "Riches of Deofolwitga"
 DWI_riches_of_deofolwitga_desc:0 "The hobgoblins to our south are living on a literal gold mine and they have no idea how to use it! It should fund our efforts to spread the word of Chaos in Asgarnia."
 DWI_intimidate_entrana_title:0 "Intimidate Entrana"
 DWI_intimidate_entrana_desc:0 "There are a lot more Zamorakians over in Kandarin which could make excellent allies, but in our way is the centre of Saradominist worship over in Entrana. We need to show their navy can't stand in our way."
  
 DWI_stand_up_to_the_donblas_title:0 "Stand Up to the Donblas"
 DWI_stand_up_to_the_donblas_desc:0 "The Donblas are our biggest obstacle to Asgarnian domination. Attacking the castle at Farradorn directly would be too risky right now, but a show of strength could discourage them from intervening while we take over southern Asgarnia."
 DWI_break_the_farming_order_title:0 "Break the Farming Order"
 DWI_break_the_farming_order_desc:0 "Farms are orderly - and boring. We can get food much faster with fishing, hunting or stealing, and their land can be put to much better use. Like being on fire."
 DWI_take_down_rimmington_title:0 "Take Down Rimmington"
 DWI_take_down_rimmington_desc:0 "Rimmington is the only place that stands in our way of dominating Asgarnia's west coast."
 DWI_port_of_call_title:0 "Port of Call"
 DWI_port_of_call_desc:0 "Now we are able to finally close off the Asgarnian coast, thus directing the region's trade to ourselves and not to the Saradominists."
