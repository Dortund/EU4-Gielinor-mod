 MCE_miscellanean_rivalry_title:0 "Miscellanean Rivalry"
 MCE_miscellanean_rivalry_desc:0 "As long as we can remember, Miscellania and Etceteria have been at odds. However, we don't need to fight our rival to show our superiority - we can intimidate them with sheer numbers!"
 
 MCE_reform_the_monarchy_title:0 "Reform the Monarchy"
 MCE_reform_the_monarchy_desc:0 "In the chaos of the late-Fourth and early-Fifth Ages, an approach of insular development seemed ideal to keep away from the dangers of Gielinor. But adventurers are everywhere now, and we cannot afford to stay so isolated..."