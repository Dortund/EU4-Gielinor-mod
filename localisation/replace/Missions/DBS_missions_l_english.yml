l_english:
 DBS_asgarnian_ambitions_title:0 "Asgarnian Ambitions"
 DBS_asgarnian_ambitions_desc:0 "Our leaders have an ambition to unite Asgarnia under one rule. However, for us to do this we are likely to face fierce opposition. Perhaps some successful investments or initial conquests will lessen this disquiet."
 DBS_feed_the_tribe_title:0 "Feed the Tribe"
 DBS_feed_the_tribe_desc:0 "The Asgarnian farmlands are rich in grain and cattle alike. Securing it is vital if we are to support a growing population."
 DBS_conquer_the_coast_title:0 "Conquer the Coast"
 DBS_conquer_the_coast_desc:0 "We have no chance of being able to project power without access to a port. The port to our south has the potential to be the world's finest."
 DBS_schemes_of_valzin_title:0 "Schemes of Valzin"
 DBS_schemes_of_valzin_desc:0 "Perhaps the Donblas' territorial ambitions are best-served not with religious fervour, but with pragmatic Asgarnian nationalism."
 DBS_direction_of_faith_title:0 "Direction of Faith"
 DBS_direction_of_faith_desc:0 "The Donblas stand at a crossroads between faiths - now it is time to decide where it goes from here."
 DBS_direction_of_faith_tooltip:0 "This event only appears if you have not yet formed Asgarnia. Depending on your tolerance of heathens and choices in previous events, you may have the opportunity to change religion to Guthix or Zamorak."
 DBS_handle_the_faiths:0 "Must have experienced §YThe White Knights of Farradorn§!, §YGuthixian Relations§! and §YThe Guidance of Valzin§! events."
 
 DBS_rise_of_falador_title:0 "Rise of Falador"
 DBS_rise_of_falador_desc:0 "A proper nation deserves a proper capital, strong enough to rival even Varrock."
 
 DBS_stand_against_the_wizards_title:0 "Stand Against the Wizards"
 DBS_stand_against_the_wizards_desc:0 "The Zamorakian Dark Wizards are a pain to all righteous Asgarnians, but they are receptive to a show of force. That might help us build a legitimate claim to their territory."
 DBS_stop_the_dark_wizards_title:0 "Stop the Dark Wizards"
 DBS_stop_the_dark_wizards_desc:0 "The Dark Wizards have been a thorn in our side for far too long. It is time to defeat them once and for all."
 DBS_fate_of_taverley_title:0 "Fate of Taverley"
 DBS_fate_of_taverley_desc:0 "We have no major quarrels with the druids of Taverley, but they must recognise that they must come under our rule if northwestern Asgarnia is to be secured."
 DBS_power_in_asgarnia_title:0 "Power in Asgarnia"
 DBS_power_in_asgarnia_desc:0 "If we are able to establish ourselves over enough of Asgarnia, we can justify our position as a hegemon against the expansion of Misthalin."
 
