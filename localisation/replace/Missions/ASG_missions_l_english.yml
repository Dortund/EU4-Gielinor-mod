l_english:
# Secular Missions
 ASG_raw_materials_title:0 "Raw Materials"
 ASG_raw_materials_desc:0 "Asgarnia has always attracted a dwarven interest, and our natural supplies of minerals are a good reason why. With proper investment, our mines can supply artisans and blacksmiths alike a ready supply of materials."
 ASG_castles_of_asgarnia_title:0 "Castles of Asgarnia"
 ASG_castles_of_asgarnia_desc:0 "Religious tensions in Asgarnia emphasise the need for greater defences in key locations. With a steady supply of raw materials, we are in a good position to build them."
 ASG_housing_boom_title:0 "Housing Boom"
 ASG_housing_boom_desc:0 "Advances in magic have allowed the creation of pocket realms big enough to host houses. This could allow large numbers of adventurers to live in Asgarnia - giving us easy access to their skills."
 ASG_inventive_spirit_title:0 "Inventive Spirit"
 ASG_inventive_spirit_desc:0 "A mixture of cultures, a crossroads of Gielinor - Asgarnia is brimming with potential. Any moment now a scientific revolution seems destined to take place..."
 
 ASG_unify_asgarnia_title:0 "Unify Asgarnia"
 ASG_unify_asgarnia_desc:0 "We must finish the work of unifying Asgarnia under one rule."
 ASG_expansion_of_falador_title:0 "Expansion of Falador"
 ASG_expansion_of_falador_desc:0 "The task of centralising our nation requires a strong capital."
 ASG_crafting_guild_title:0 "Crafting Guild"
 ASG_crafting_guild_desc:0 "County Braed is rich in raw materials and not too far from Falador to be useful. With ready supplies of clay, silver and gold, we can make this the premier site for the training of crafters!"
 ASG_mining_guild_title:0 "Mining Guild"
 ASG_mining_guild_desc:0 "Prospectors have found traces of precious minerals beneath Falador. We could be sitting on not a mere gold mine, but a runite mine! Mining beneath a populous city is a difficult task however - we shall need the greatest miners in Gielinor to get at it."
 ASG_artisans_workshop_title:0 "Artisans' Workshop"
 ASG_artisans_workshop_desc:0 "The Mining Guild has delivered a rich assortment of minerals, but our current smithing facilities in Falador are inadequate to handle it all."
 ASG_masterwork_title:0 "Masterwork"
 ASG_masterwork_desc:0 "Imports of rare and precious metals from Wushanko, combined with a large population of skilled artisans, has enabled the creation of Masterwork armour - perfectly-formed to deflect blows even from the strongest of beasts."
 asg_masterwork_dev_boost_tooltip:0 "Every owned province producing §YRefined Products§! will gain §G2§! Base Tax and §G2§! Base Production."
 
 ASG_misthalanian_settlement_title:0 "Misthalanian Settlement"
 ASG_misthalanian_settlement_desc:0 "Now that we're a unified Asgarnia, it is time to work out how to handle Misthalin - a nation which once loomed over us but is now more of an equal."
 ASG_runecrafting_boom_title:0 "Runecrafting Boom"
 ASG_runecrafting_boom_desc:0 "The discovery of Runecrafting is a huge boom for Asgarnia, with the air, mind and body altars within reach. Some object to this new art, but it should bring in great wealth and power to us all."
 ASG_fate_of_the_imcando_title:0 "Fate of the Imcando"
 ASG_fate_of_the_imcando_desc:0 "The Imcando combine the skills of smithing and magic. The spread of Runecrafting has given them a greater ability to craft magical weapons than ever before - but they are vulnerable. The enemies of Runecrafting will aim to destroy them and we must take a side."
 ASG_no_runecrafting_crusaders_in_asgarnia:0 "No country with the §YRunecrafting Crusader§! government has territory in the Asgarnian region."
 ASG_friends_in_the_east_title:0 "Friends in the East"
 ASG_friends_in_the_east_desc:0 "Good relations with the people of Wushanko are necessary if we are to secure an economic foothold in the region."
 asg_wushanko_relations_tooltip:0 "Asgarnian support in Wushanko"
 ASG_steer_to_sarim_title:0 "Steer to Sarim"
 ASG_steer_to_sarim_desc:0 "A simple problem is that Wushanko is a long, long way away from Asgarnia. With the Kharidian Desert between us and there, controlling the sea routes east of Karamja is our only realistic way to get the Wushankoan wealth back home."
 ASG_wushanko_imports_title:0 "Wushanko Imports"
 ASG_wushanko_imports_desc:0 "What wonderful goods our traders bring in! Beautiful pottery, versatile bamboo, deadly gunpowder! We should control it all."
 ASG_wushanko_missions_title:0 "Wushanko Missions"
 ASG_wushanko_missions_desc:0 "The faith of Wushanko to us seems vague and undefined - far from the example of our true faith. Let us show them what they are missing."
 ASG_wushanko_missions_reward_main_religion_tooltip:0 "Allows the ability to propagate religion via trade with just 40% trade power in a node."
 ASG_wushanko_missions_reward_misc_religion_tooltip:0 "Allows the ability to propagate religion via trade in provinces of the §YWushanko Guardian§! religious group."
 
 ASG_break_the_blockade_title:0 "Break the Blockade"
 ASG_break_the_blockade_desc:0 "Piracy doomed Port Lina but a unified Asgarnia can float a navy strong enough to keep such threats at bay."
 ASG_sarim_triumphant_title:0 "Sarim Triumphant"
 ASG_sarim_triumphant_desc:0 "Port Sarim has the potential to be the Unquiet Ocean's greatest port!"
 ASG_musan_colony_title:0 "Musan Colony"
 ASG_musan_colony_desc:0 "In our efforts to project naval power, we could benefit from access to more ports. Musa Point on the edge of Karamja is an ideal location, both easy for us to attack and hold."
 ASG_wushanko_discoveries_title:0 "Wushanko Discoveries"
 ASG_wushanko_discoveries_desc:0 "Rumours of strange, unique trade goods has sparked our merchants' interest. Now, if we could just find our way to them..."
 ASG_arc_landing_title:0 "Arc Landing"
 ASG_arc_landing_desc:0 "The Arc is an ideal place for us to colonise. It's the closest place in Wushanko to Asgarnia, and unlike the similarly-nearby Skull, its residents aren't paranoid about invasion."
 ASG_expanding_colonies_title:0 "Expanding Colonies"
 ASG_expanding_colonies_desc:0 "Each of the island chains of Wushanko has a different speciality; let us spread out to more islands to corner the market for these goods."
 ASG_the_farthest_east_title:0 "The Farthest East"
 ASG_the_farthest_east_desc:0 "Hidden behind the rising sun are islands rich yet isolated which until now we never dreamt of discovering, let alone taking."
 ASG_guardians_of_the_world_title:0 "Guardians of the World"
 ASG_guardians_of_the_world_desc:0 "Some great power lies in the furthest reaches of Wushanko, a power that not even the local people know much about. A power that must be investigated lest it fall into enemy hands!"
 asg_guardians_of_the_world_tooltip:0 "Enables use of the §YKami-shima Nexus§! monument."
 
 ASG_crandorian_relations_title:0 "Crandorian Relations"
 ASG_crandorian_relations_desc:0 "Crandor is a key naval power in the northern Unquiet Ocean. If we want to trade further afield, we will have to handle them some way or another."
 ASG_the_power_of_trade_title:0 "The Power of Trade"
 ASG_the_power_of_trade_desc:0 "As Asgarnia coalesces into a single powerful nation, and its maritime presence matures, its economic base shall grow and with it the power of its trade."
 ASG_owed_adventurer_tooltip:0 "The promise of great wealth will immediately attract adventurers to your realm in the §YAge of Adventurers§! or later."
 ASG_asgarnian_adventurers_title:0 "Asgarnian Adventurers"
 ASG_asgarnian_adventurers_desc:0 "We are rich in opportunities for wandering travellers, sellswords and those simply seeking adventure. They can be our front lines in the exploration of new trade opportunities."
 ASG_asgarnian_adventurers_ai_tooltip:0 "The AI receives a colony in the Arc to encourage them to take a more historical path."
 
# Religious Missions - Starting

 ASG_SHAREDRELIGION_confirm_the_faith_title:0 "Confirm the Faith"
 ASG_SHAREDRELIGION_confirm_the_faith_desc:0 "A unified state would benefit from clearer religious leadership."
 ASG_confirm_the_faith_flag:0 "Completing this mission will unlock access to extra missions §Ydepending on your current religion§!."

 ASG_branching_2_14_title:0 "Branching Mission"
 ASG_branching_2_14_desc:0 "This is a §YBranching Mission.§!"
 ASG_branching_2_15_title:0 "Branching Mission"
 ASG_branching_2_15_desc:0 "This is a §YBranching Mission.§!"

 ASG_branching_3_14_title:0 "Branching Mission"
 ASG_branching_3_14_desc:0 "This is a §YBranching Mission.§!"
 ASG_this_is_a_branching_mission:0 "This is a §YBranching Mission.§! Complete the mission §YConfirm the Faith§! to enable a path depending on which religion Asgarnia follows."
 ASG_branching_3_15_title:0 "Branching Mission"
 ASG_branching_3_15_desc:0 "This is a §YBranching Mission.§!"
 ASG_branching_3_16_title:0 "Branching Mission"
 ASG_branching_3_16_desc:0 "This is a §YBranching Mission.§!"
 
