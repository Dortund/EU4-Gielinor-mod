# Religious Missions - Generic

 ASG_miscellaneous_missions_branch_flag_tooltip:0 "Preview the §YMiscellaneous Religion§! branch."

 ASG_GENRELIGION_knights_of_asgarnia_title:0 "Knights of Asgarnia"
 ASG_GENRELIGION_knights_of_asgarnia_desc:0 "The Saradominist White Knights guard Falador from threats - but is an order opposed to our faith worth keeping?"
 ASG_GENRELIGION_true_unification_title:0 "True Unification"
 ASG_GENRELIGION_true_unification_desc:0 "Crandor and Entrana might not be on the Asgarnian mainland, but to prove our legitimacy we must unite all Asgarnian peoples in one in the new faith."
 
 ASG_GENRELIGION_spread_the_new_faith_title:0 "Spread the New Faith"
 ASG_GENRELIGION_spread_the_new_faith_desc:0 "None were expecting our religious direction, so we must prove we are serious about this new religion."
 ASG_GENRELIGION_allies_in_faith_title:0 "Allies in Faith"
 ASG_GENRELIGION_allies_in_faith_desc:0 "We cannot stand alone in our religious convictions! There must be fellow faithful realms so we can stand stronger together."
 ASG_GENRELIGION_faithful_subjects_title:0 "Faithful Subjects"
 ASG_GENRELIGION_faithful_subjects_desc:0 "Expansion is easier when done diplomatically, working with people with a common cause to us."
 ASG_GENRELIGION_new_asgarnian_legacy_title:0 "New Asgarnian Legacy"
 ASG_GENRELIGION_new_asgarnian_legacy_desc:0 "The past struggles between the Saradominists, Zamorakians and Guthixians of Asgarnia are behind us. From now on, Asgarnia has a new history, and a new future."

 ASG_GENRELIGION_rededicate_the_churches_title:0 "Rededicate the Churches"
 ASG_GENRELIGION_rededicate_the_churches_desc:0 "The task of bringing Asgarnia to the new faith necessarily requires us to propagandise it more widely."
 ASG_GENRELIGION_a_new_monastery_title:0 "A New Monastery"
 ASG_GENRELIGION_a_new_monastery_desc:0 "Saradominists viewed the area to the east of Ice Mountain as an excellent place for religious contemplation. Let us take it first so they can't."

# Religious Missions - Saradomin

 ASG_saradomin_missions_branch_flag_tooltip:0 "Preview the §YSaradominist§! branch."
 
 ASG_SARA_monastic_living_title:0 "Monastic Living"
 ASG_SARA_monastic_living_desc:0 "Let us invest in the fledgling monastic communities near Ice Mountain."
 ASG_SARA_defence_of_harmony_title:0 "Defence of Harmony"
 ASG_SARA_defence_of_harmony_desc:0 "The distant island of Harmony hosts a community of monks far, far away from the safety of Entrana. This isolated bastion of Saradomin needs our support."
 ASG_SARA_convert_hyu_ji_title:0 "Convert Hyu-Ji"
 ASG_SARA_convert_hyu_ji_desc:0 "Not far from Entrana is an island used as a sanctuary for strange people known as the Sea Orphans. They are an excellent target to bring to the Saradominist fold."

 ASG_SARA_entranan_connection_title:0 "Entranan Connection"
 ASG_SARA_entranan_connection_desc:0 "Saradomin first set foot upon Gielinor on the island of Entrana, the centre of Saradominist worship. And yet, his true base of power and following would be found here, in what is now Asgarnia. Let us strengthen the ties between Saradomin's physical and spiritual bases of influence."
 ASG_SARA_control_the_church_title:0 "Control the Church"
 ASG_SARA_control_the_church_desc:0 "With our ancient Saradominist history, it is only right that Asgarnia takes a role of leadership in the Church of Saradomin."
 ASG_SARA_saradomins_armoury_title:0 "Saradomin's Armoury"
 ASG_SARA_saradomins_armoury_desc:0 "The White Knights developed a form of metalworking which imbues steel with a small degree of holy power. Expanding access to these armaments more widely could aid the discipline of our troops."
 ASG_SARA_crusade_for_saradomin_title:0 "Crusade for Saradomin"
 ASG_SARA_crusade_for_saradomin_desc:0 "To defeat the evils of Gielinor we must be willing to fight - no matter how powerful they may be!"

 ASG_SARA_white_knights_of_falador_title:0 "White Knights of Falador"
 ASG_SARA_white_knights_of_falador_desc:0 "The White Knights are a knightly order based in Falador - we need to decide what their future is in Asgarnia."
 ASG_SARA_temple_knight_expansion_title:0 "Temple Knight Expansion"
 ASG_SARA_temple_knight_expansion_desc:0 "The Temple Knights have served Saradomin's interests in Asgarnia long before the unification of the region, but with the power of our combined nation we can expand its reach across Gielinor."
 ASG_SARA_kandarin_operations_title:0 "Kandarin Operations"
 ASG_SARA_kandarin_operations_desc:0 "Kandarin could be turned to Saradomin's light but is plagued by the weight of belief in Zamorak and other false gods."
 ASG_SARA_brave_new_world_title:0 "Brave New World"
 ASG_SARA_brave_new_world_desc:0 "Could Asgarnia weather the storms of an uncertain future? Only with Saradomin by our side is it possible."
 
 ASG_SARA_handle_the_zamorakians_title:0 "Handle the Zamorakians"
 ASG_SARA_handle_the_zamorakians_desc:0 "Followers of Zamorak are the old enemy to Saradomin - but perhaps we could use them to our own ends, rather than destroying them?"
 ASG_SARA_handle_the_zamorakians_tolerance_tooltip:0 "Tolerance of Zamorakians is at least +1"
 ASG_SARA_handle_the_zamorakians_conversion_tooltip:0 "No province in the Asgarnia region follows Zamorak"
 ASG_SARA_defence_of_falador_title:0 "Defence of Falador"
 ASG_SARA_defence_of_falador_desc:0 "As an ancient bastion of Order and Light, Falador will always be a target for evil threats. Hold fast to our faith and we shall keep it secure."
 ASG_sara_defence_of_falador_complete_disaster:0 "Complete the §YKinshra-White Knight War§! disaster."
 obj_convert_25_provinces_tooltip:0 "Convert 25 provinces to your religion."
 ASG_SARA_the_secret_artefacts_title:0 "The Secret Artefacts"
 ASG_SARA_the_secret_artefacts_desc:0 "Legend speaks of the Eye of Saradomin, a powerful artefact that may or may not remain on Gielinor. If only we could understand more of this mystery..."
 knows_about_stone_of_jas_tooltip:0 "Have knowledge of the §YStone of Jas§!"
 knows_about_staff_of_armadyl_tooltip:0 "Have knowledge of the §YStaff of Armadyl§!"

 ASG_SARA_taverlese_relations_title:0 "Taverlese Relations"
 ASG_SARA_taverlese_relations_desc:0 "We should determine the future of the main Guthixian bastion in Asgarnia."
 ASG_SARA_tale_of_armadyl_title:0 "Tale of Armadyl"
 ASG_SARA_tale_of_armadyl_desc:0 "The official line of the Church of Saradomin only accepts the existence of three gods: Saradomin, Zamorak and Guthix. But to those in the know, there is one who stood by Saradomin's side during much of the Third Age, known as Armadyl. His followers are now few in number but out there somewhere - and have vital knowledge that would aid all followers of Order."
 ASG_SARA_temple_of_lost_ancients_title:0 "Temple of Lost Ancients"
 ASG_SARA_temple_of_lost_ancients_desc:0 "Something terrible stirs in the North, the remnant of an old battle that has never ended - we must prevent it from spilling into the rest of Gielinor!"

# Religious Missions - Zamorak

 ASG_zamorak_missions_branch_flag_tooltip:0 "Preview the §YZamorakian§! branch."

 ASG_ZAM_glory_of_falador_title:0 "Glory of Falador"
 ASG_ZAM_glory_of_falador_desc:0 "As an ancient bastion of Order and Light, Falador will always be a target for the vile Saradominists who want it back. Hold fast to our faith and we shall keep it secure."
 ASG_ZAM_children_of_zamorak_title:0 "Children of Zamorak"
 ASG_ZAM_children_of_zamorak_desc:0 "Our friends in Kandarin speak of a strange cave system to the west, barely explored. We seem oddly drawn to it, like Zamorak wants us there..."
 ASG_ZAM_children_of_zamorak_underground_pass_tooltip:0 "Any already-owned provinces in the §YUnderground Pass area§! will gain §G+1§! base manpower."

 ASG_ZAM_fate_of_the_white_knights_title:0 "Fate of the White Knights"
 ASG_ZAM_fate_of_the_white_knights_desc:0 "The White Knights traditionally defended Farradorn, or now Falador, from all manner of threats - including followers of our glorious Lord Zamorak. Either they shall be made to work for us or they shall be crushed!"
 ASG_had_triumph_of_knights_tooltip:0 "Experienced the §YTriumph of the Knights§! event."
 ASG_ZAM_onto_entrana_title:0 "Onto Entrana"
 ASG_ZAM_onto_entrana_desc:0 "Entrana is the core of Saradominist worship, and its conquest would prove the supremacy of Zamorak."
 ASG_ZAM_allies_of_ourania_title:0 "Allies of Ourania"
 ASG_ZAM_allies_of_ourania_desc:0 "Zamorakian presence has historically been stronger in Kandarin than Asgarnia - an ideal place for us to seek alliances allowing us to collectively control the Unquiet Ocean for Zamorak."

 ASG_ZAM_chaos_druids_of_taverley_title:0 "Chaos Druids of Taverley"
 ASG_ZAM_chaos_druids_of_taverley_desc:0 "Chaos Druids believe that Zamorak is the purest expression of Guthix's teachings. Their familiarity with druidic life should make them ideal rulers of Taverley while keeping unrest in check."
 ASG_ZAM_chaos_druids_of_taverley_tooltip:0 "Enables use of the §YTaverley Stone Circle§! monument when following the Zamorakian faith."
 ASG_ZAM_taverley_dungeon_title:0 "Taverley Dungeon"
 ASG_ZAM_taverley_dungeon_desc:0 "Vast dungeons beneath Taverley would make an ideal base of operations for our military, without the visibiity of alternative locations like Falador or Ice Mountain."
 ASG_ZAM_return_to_karamja_title:0 "Return to Karamja"
 ASG_ZAM_return_to_karamja_desc:0 "A curious legend has come to our attention - something about a betrayed Zamorakian priest on Karamja centuries ago? Seems as good as reason as any for an invasion."

 ASG_ZAM_valzins_legacy_title:0 "Valzin's Legacy"
 ASG_ZAM_valzins_legacy_desc:0 "Lord Valzin from Misthalin called on loyal Zamorakians to serve the interests of unifying the lands west of the River Lum. Well, shouldn't we go ahead and unify the lands west of the Lum then?"
 ASG_ZAM_salve_passage_title:0 "Salve Passage"
 ASG_ZAM_salve_passage_desc:0 "Word has it that factions of Zamorakians can be found far to our east - but are under the heel of vampyres who once served Zamorak but no longer do! We should make our way there and investigate."
 ASG_ZAM_zamoraks_wilderness_title:0 "Zamorak's Wilderness"
 ASG_ZAM_zamoraks_wilderness_desc:0 "It is evident that the Wilderness is rightfully Zamorakian land, from the many followers of our Lord who dwell within to the scorched ground gloriously desecrated by Zamorak himself! Unfortunately, the land is divided under many different rulers."

 ASG_ZAM_return_to_canifis_title:0 "Return to Canifis"
 ASG_ZAM_return_to_canifis_desc:0 "The truth is now known: Morytania is the rightful conquest of Lord Zamorak, who was betrayed by vampyric heresy. For the good of the werewolves loyal to Zamorak - and for our own sake - we must take Morytania for Asgarnia!"
 ASG_ZAM_return_to_canifis_werewolf_tooltip:0 "Every owned province in the §YWerewolf§! culture group will gain the §YZamorakian Overlords§! province modifier for 10 years, giving the following effects:\nMonthly Autonomy Change: §G-0.10§!\nYears of Separatism: §G-10§!"

# Religious Missions - Guthix

 ASG_guthix_missions_branch_flag_tooltip:0 "Preview the §YGuthixian§! branch."

 ASG_GUTHIX_herbs_of_trollheim_title:0 "Herbs of Trollheim"
 ASG_GUTHIX_herbs_of_trollheim_desc:0 "Goutweed is known to grow in the mountains of Trollweiss, and it is an extremely versatile herb with applications in druidic rituals, dream magic and as a consistently good seasoning. Securing a permanent supply of these herbs requires direct action, and though it pains us to fight the trolls in their own territory, the Balance is better-served with the herbs in our possession."
 ASG_GUTHIX_the_unsealing_temple_title:0 "The Unsealing Temple"
 ASG_GUTHIX_the_unsealing_temple_desc:0 "Long ago did the followers of four Gods fight over a sword. To end this conflict, Guthix's followers froze them in ice - but the temple risks becoming unsealed, spilling the battle into the rest of Gielinor! We must stop this threat before it can begin."
 ASG_GUTHIX_may_use_temple_as_guthix_tooltip:0 "Enables use of the §YTemple of Lost Ancients§! monument when following the Guthixian faith."
 asg_guthix_completed_unsealing_temple_flag_tooltip:0 "Have completed §YThe Unsealing Temple§! mission as §YAsgarnia§!"

 ASG_GUTHIX_taverley_and_falador_title:0 "Taverley and Falador"
 ASG_GUTHIX_taverley_and_falador_desc:0 "The time has come to choose what our permanent capital should be - the heartland of Asgarnia in Falador, or the centre for Guthixian worship in Taverley?"
 ASG_GUTHIX_shadows_of_burthorpe_title:0 "Shadows of Burthorpe"
 ASG_GUTHIX_shadows_of_burthorpe_desc:0 "Constant pressure from the north threatens Burthorpe - and if the trolls can bring it down, Taverley is next. Reinforcing Burthorpe is a must if we are to minimise the risk of violence."
 ASG_GUTHIX_dwarven_outreach_title:0 "Dwarven Outreach"
 ASG_GUTHIX_dwarven_outreach_desc:0 "Communities of Guthixian Dwarves live beyond the Trollheim mountains. We should establish ties."
 capital_not_in_asgarnia:0 "Capital must §Ynot§! be in the Asgarnian region."
 ASG_GUTHIX_fremennik_ties_title:0 "Fremennik Ties"
 ASG_GUTHIX_fremennik_ties_desc:0 "Further beyond the Trollheim Mountains are the Fremennik, a peoples who are often like-minded in issues of Guthix. Their strength shall be required in our efforts to bring peace to Gielinor."
 ASG_GUTHIX_guthixs_victory_title:0 "Guthix's Victory"
 ASG_GUTHIX_guthixs_victory_desc:0 "Our allies are with us, much like they were with Guthix at the end of the Third Age. Guthix swept across Forinthry, brushing aside the tyrannous gods, and left behind the Sword of Edicts. It still stands as a reminder that mortals are to be free of their control. Let us take Forinthry again and remind Gielinor of Guthix's victory."
 ASG_GUTHIX_guthixs_victory_monument_extension:0 "Increases the yields of the §YSword of Edicts§! monument."

 ASG_GUTHIX_a_port_for_taverley_title:0 "A Port for Taverley"
 ASG_GUTHIX_a_port_for_taverley_desc:0 "Asgarnia's main port at Port Sarim is far away from the needs of Taverley. Let us develop a new one!"
 ASG_GUTHIX_gnomish_diplomacy_title:0 "Gnomish Diplomacy"
 ASG_GUTHIX_gnomish_diplomacy_desc:0 "Out somewhere in the west are a population of Gnomes loyal to Guthix. If we could just find their home lands, we could secure a useful alliance."
 ASG_GUTHIX_druids_of_the_feldips_title:0 "Druids of the Feldips"
 ASG_GUTHIX_druids_of_the_feldips_desc:0 "With the Gnomes on our side, our druids' reach is further than ever before. It is known that the ogres of the Feldip Hills share with us interests in Summoning - perhaps that can be the basis for spreading the word of Guthix?"
 ASG_GUTHIX_monastery_of_ascension_title:0 "Monastery of Ascension"
 ASG_GUTHIX_monastery_of_ascension_desc:0 "Exploring the central Feldips, a curious building with Guthixian symbols has been discovered. Initial inspections seem to reveal the presence of strange, crystal-infused beings that appear to side with Guthix - somehow. But if these are Guthixians, their extreme tendencies suggest they have lost their way."
 
 ASG_GUTHIX_handle_the_chaos_druids_title:0 "Handle the Chaos Druids"
 ASG_GUTHIX_handle_the_chaos_druids_desc:0 "Heretical druids misinterpret the word of Guthix and have ended up following Zamorak in direct contradiction of his teachings. We must remind them that the only true manifestation of Guthix is Guthix himself."
 ASG_GUTHIX_the_void_knights_title:0 "The Void Knights"
 ASG_GUTHIX_the_void_knights_desc:0 "When there is imbalance in the world, it is our duty to find a means to rectify it."
 ASG_GUTHIX_the_void_knights_tooltip:0 "Experienced the §YVisions of Dracs Melrose§! event."
 ASG_GUTHIX_void_knight_travels_title:0 "Void Knight Travels"
 ASG_GUTHIX_void_knight_travels_desc:0 "There is a new threat to emerge in the southern seas, one we must be prepared for."
 ASG_GUTHIX_swamps_of_misthalin_title:0 "Swamps of Misthalin"
 ASG_GUTHIX_swamps_of_misthalin_desc:0 "Word has got out of some kind of remnant of Guthix's power beneath the swamps of southern Misthalin. We should investigate."

 ASG_GUTHIX_crux_eqal_title:0 "Crux Eqal"
 ASG_GUTHIX_crux_eqal_desc:0 "The threats to Gielinor's balance are found throughout Gielinor and not down the road in Taverley. Asgarnia must have a more international reach - and the Crux Eqal aims to serve this purpose."
 ASG_GUTHIX_legend_of_the_valluta_title:0 "Legend of the Valluta"
 ASG_GUTHIX_legend_of_the_valluta_desc:0 "The Valluta is an old legend in Guthixian circles - a weapon? A creature? Or a metaphor for our own strength and prowess? How may that be discovered?"
 asg_guthix_valluta_karma_tooltip:0 "Your reward for this mission §Yvaries depending on your current Karma rating.§!"

# Religious Missions - Brassican

 ASG_brassica_missions_branch_flag_tooltip:0 "Preview the §YBrassican§! branch."

 ASG_BRASSICA_shadows_of_draynor_title:0 "Shadows of Draynor"
 ASG_BRASSICA_shadows_of_draynor_desc:0 "Strange powers are afoot at Draynor Manor - powers we can keep at bay with proper, nutritious brassicas."
 ASG_BRASSICA_the_fifth_kind_of_wizard_title:0 "The Fifth Kind of Wizard"
 ASG_BRASSICA_the_fifth_kind_of_wizard_desc:0 "The Wizards' Tower is known for the blue, red, green and grey wizards representing Saradomin, Zamorak, Guthix and others respectively. But clearly cabbagemancers need a real seat at the table!"
 ASG_BRASSICA_may_use_wizards_tower_tooltip:0 "Enables use of the §YWizards' Tower§! monument when following the Brassican faith."

 ASG_BRASSICA_cabbage_farms_title:0 "Cabbage Farms"
 ASG_BRASSICA_cabbage_farms_desc:0 "When lands are converted to His Leafy Wisdom, farmers put aside their lesser wheat crops to produce glorious cabbages in their place."
 ASG_BRASSICA_guthixian_harmony_title:0 "Guthixian Harmony"
 ASG_BRASSICA_guthixian_harmony_desc:0 "Taverley's druids are skilled at the cultivation of herbs and other crops. These ways can clearly be useful for our own ends."
 ASG_BRASSICA_lost_city_title:0 "Lost City"
 ASG_BRASSICA_lost_city_desc:0 "Our expansion has exposed some curious secrets. Rumours from the Guthixians of Taverley suggest some link between Entrana and Lumbridge Swamp - something to do with the seasons and the growing of crops. But what?"

 ASG_BRASSICA_grow_the_faith_title:0 "Grow the Faith"
 ASG_BRASSICA_grow_the_faith_desc:0 "Just as the cabbage needs sunlight and rain alike to grow, Asgarnia needs its unalike faiths to come together in harmony."
 ASG_BRASSICA_saradominist_harmony_title:0 "Saradominist Harmony"
 ASG_BRASSICA_saradominist_harmony_desc:0 "Monks and nuns of Saradomin are known for their practices of growing and eating cabbages. Our ways and theirs are not incompatible."
 ASG_BRASSICA_monastic_farming_title:0 "Monastic Farming"
 ASG_BRASSICA_monastic_farming_desc:0 "A quiet isolated land near Ice Mountain sounds a good place to stick all of these Saradominist or ex-Saradominist monks. They like a spot of farming, right?"

 ASG_BRASSICA_the_ooglog_road_title:0 "The Oo'glog Road"
 ASG_BRASSICA_the_ooglog_road_desc:0 "I wonder what would happen if we kicked a cabbage all the way to Oo'glog?"
 ASG_BRASSICA_zamorakian_harmony_title:0 "Zamorakian Harmony"
 ASG_BRASSICA_zamorakian_harmony_desc:0 "Zamorak's followers have a way with cauldrons and fire. Boiled cabbage... now that's an idea."





