 UZE_restore_uzers_extent_title:0 "Restore Uzer's Extent"
 UZE_restore_uzers_extent_desc:0 "Much work has to be done yet if Uzer is to match up to its former glory."
 UZE_legacy_of_tolerance_title:0 "Legacy of Tolerance"
 UZE_legacy_of_tolerance_desc:0 "Uzer's greatest strength was not its army of clay golems, but as a rare city in Gielinor where all manner of faiths could peacefully coexist. It is imperative we live up to that legacy."
 
 UZE_instruct_the_golems_title:0 "Instruct the Golems"
 UZE_instruct_the_golems_desc:0 "To defend our city properly, we should build more clay golems - and to do that, we need a sufficient infrastructure."