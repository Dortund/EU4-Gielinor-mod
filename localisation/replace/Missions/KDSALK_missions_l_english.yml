# Kharidian Shared

 KDS_expand_our_trade_power_title:0 "Expand Our Trade Power"
 KDS_expand_our_trade_power_desc:0 "To be taken seriously as a regional power, we need to at the very least have a strong position over our own trade."
 KDS_kharidian_port_title:0 "Kharidian Port"
 KDS_kharidian_port_desc:0 "We have secured our trade position on land, but now we need to consider our position on the seas."
 KDS_unlock_spirit_anglers_tooltip:0 "Unlocks the §TSpirit Anglers§! Naval Doctrine once [1000.GetName] is owned by any nation."
 KDS_terror_of_tempoross_title:0 "Terror of Tempoross"
 KDS_terror_of_tempoross_desc:0 "The depths of the sea holds many terrors we may barely comprehend - yet proving our victory over one would be a huge reassurance to our sailors."

 KDS_misthalin_or_menaphos_title:0 "Misthalin or Menaphos?"
 KDS_misthalin_or_menaphos_desc:0 "Like the arms of Het himself, we hold open the passes into the Kharidian Desert, while limiting the reach of bandits. While this role has won us much respect among the merchants of Misthalin and Menaphos, we have received little tangible for our efforts. Perhaps by making the two nations compete for our support we could get something more direct?"
 KDS_guaranteed_MST_help_tooltip:0 "Misthalin will be §Gguaranteed§! to assist us in our settling of Al Kharid."
 KDS_guaranteed_MPS_help_tooltip:0 "Menaphos will be §Gguaranteed§! to assist us in our settling of Al Kharid."
 KDS_settle_al_kharid_title:0 "Settle Al Kharid"
 KDS_settle_al_kharid_desc:0 "Below the cliffs we settle is a large expanse of flat and stable land, capable of supporting a major city. With the support of Misthalin, or failing that, Menaphos or even our own determination, we can create it."
 KDS_future_of_north_kharid_title:0 "Future of North Kharid"
 KDS_future_of_north_kharid_desc:0 "As we develop from a small Kharidian tribe to a full-fledged kingdom, we must determine what our ambitions are. Misthalin could offer freedom from the Pharoah of Kharid's rule, yet if we side with the Pharoah we could legitimise conquest in the name of serving the Menaphite Pantheon."

 KDS_worthy_army_title:0 "Worthy Army"
 KDS_worthy_army_desc:0 "Our meagre forces cannot hold the Kharidian Passes forever. Let us expand the army to more effectively perform this task."
 KDS_professional_brothers_title:0 "Professional Brothers"
 KDS_professional_brothers_desc:0 "A sense of fraternity shall help tie our forces together, and what better way than to make military service professional rather than conscripted?"
 KDS_professional_brothers_duel_arena_setup_tooltip:0 "Once the §YArina§! province is owned, the §GDuel Arena§! shall be excavated."
 KDS_build_the_duel_arena_title:0 "Build the Duel Arena"
 KDS_build_the_duel_arena_desc:0 "Old ruins poke through the sands. If we had sufficient funds, we may be able to find exactly what is buried down there."
 KDS_duel_arena_conditional_modifier_tooltip:0 "Enables the conditional modifier for the §YDuel Arena§! monument."
 KDS_the_power_of_runecrafting_title:0 "The Power of Runecrafting"
 KDS_the_power_of_runecrafting_desc:0 "The goblins to our west - a constant threat - are overwhelmingly melee combattants. Mages can deal with them with ease, but with a lack of runes or magically trained people, we lack this perhaps perfect defensive option."

 KDS_scimitar_manufacture_title:0 "Scimitar Manufacture"
 KDS_scimitar_manufacture_desc:0 "Up to this point, we have tended to rely on small-scale artisan crafting or imports for our weaponry. By developing our own permanent forges, we can more easily supply our armies with the armanents they need."

