l_english:
 NDH_potion_production_title:0 "Potion Production"
 NDH_potion_production_desc:0 "Plentiful water, a local goat population and nearby monsters which carry herbs makes Nardah an ideal location for the practice of Herblore."
 NDH_draw_in_adventurers_title:0 "Draw in Adventurers"
 NDH_draw_in_adventurers_desc:0 "Nardah's remote location, while generally safe from threats, also means our allies can be slow to respond when we actually are in danger. Luckily, our local genie lamps seem to be highly-prized by adventurers..."
 NDH_spirits_of_the_elid_title:0 "Spirits of the Elid"
 NDH_spirits_of_the_elid_desc:0 "Nardah was founded to serve the glory of Elidinis, but that was a very long time ago and many of the old ways are being forgotten. Perhaps it is now time to find a new direction?"
 NDH_has_spirits_of_the_elid_line_start:0 "Have experienced the first event of the §YSpirits of the Elid§! chain. This appears after embracing the §YQuests§! institution."