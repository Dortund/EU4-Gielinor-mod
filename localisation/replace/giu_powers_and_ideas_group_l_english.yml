l_english:

dwarven_outpost_ideas:0 "Dwarven Outpost Ideas"
 dwarven_outpost_ideas_start:0 "Dwarven Outpost Traditions"
 dwarven_outpost_ideas_bonus:0 "Dwarven Outpost Ambition"
 DOgroup_wherever_ore_takes_us:0 "Wherever Ore Takes Us"
 DOgroup_wherever_ore_takes_us_desc:0 "If valuable ores were easy to reach, they would have been mined already! We must push ourselves further to exploit the best ores wherever they may be."
 DOgroup_frontier_construction:0 "Frontier Construction"
 DOgroup_frontier_construction_desc:0 "Away from the luxuries of a good mountain we have to make do with rather less grand buildings, much like the humans."
 DOgroup_line_of_command:0 "Line of Command"
 DOgroup_line_of_command_desc:0 "Let us never forget our mission: to mine and trade with our parent city."
 DOgroup_trade_mission:0 "Trade Mission"
 DOgroup_trade_mission_desc:0 "Our little colony exists to trade."
 DOgroup_exchange_of_ideas:0 "Exchange of Ideas"
 DOgroup_exchange_of_ideas_desc:0 "Living in close proximity to non-dwarves has provided us insight into the strange ways they do things."
 DOgroup_multicannon_privileges:0 "Multicannon Privileges"
 DOgroup_multicannon_privileges_desc:0 "Out in the open you can fire cannons all you want without risking a cave-in! Pow!"
 DOgroup_local_assistance:0 "Local Assistance"
 DOgroup_local_assistance_desc:0 "Seems some of these adventuring types are willing to aid our defence for the promise of a paltry reward."
 
fremennik_clan_ideas:0 "Fremennik Clan Ideas"
 fremennik_clan_ideas_start:0 "Fremennik Clan Traditions"
 fremennik_clan_ideas_bonus:0 "Fremennik Clan Ambition"
 fremclan_traditional_leadership:0 "Traditional Leadership"
 fremclan_traditional_leadership_desc:0 "The Fremennik were the first human settlers of Gielinor and our clan claims direct descent from these earliest peoples."
 fremclan_rise_of_v:0 "Rise of V"
 fremclan_rise_of_v_desc:0 "The Northern Pantheon is steadily being displaced. In its place, Fremennik are increasingly using the legend of V as a standin for the old faith - yet there is no reason why they cannot co-exist."
 fremclan_prestige_of_war:0 "Prestige of War"
 fremclan_prestige_of_war_desc:0 "Sagas were never composed about warriors who stayed home."
 fremclan_shipbuilding_expansion:0 "Shipbuilding Expansion"
 fremclan_shipbuilding_expansion_desc:0 "Longboats require relatively few materials compared to the oversized ships of the south and can be built at a faster pace."
 fremclan_winter_warfare:0 "Winter Warfare"
 fremclan_winter_warfare_desc:0 "A war in the coldest of winters is a grave risk but one that our enemies are not prepared for. By training our warriors on survivalism we can take the initiative while minimising casualties."
 fremclan_union_of_clans:0 "Union of Clans"
 fremclan_union_of_clans_desc:0 "Divided, the Fremennik Clans have little chance to survive the growing onslaught of magic. The clans must be united, not only through the battlefield but in the minds of fellow Fremennik."
 fremclan_invasion_strategies:0 "Invasion Strategies"
 fremclan_invasion_strategies_desc:0 "The evil of Runecrafting is spreading through Gielinor. We must be ready to face it. Let us put aside old clan loyalties in the name of this new mission!"